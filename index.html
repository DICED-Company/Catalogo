                                            className="text-[10px] font-black text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/60 px-2.5 py-1 rounded-full"
                                        >
                                            QUITAR
                                        </button>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                maxLength={20}
                                                disabled={isValidatingPromo}
                                                value={promoInput}
                                                onChange={(e) => { setPromoInput(e.target.value.toUpperCase()); setPromoError(''); }}
                                                placeholder="INGRESA TU CÓDIGO"
                                                className="flex-1 min-w-0 bg-slate-50 dark:bg-neutral-950 border border-slate-200 dark:border-neutral-800 rounded-2xl px-3.5 py-3 text-xs font-black text-black dark:text-white focus:outline-none focus:border-blue-500 uppercase disabled:opacity-60"
                                            />
                                            <button
                                                type="button"
                                                disabled={isValidatingPromo}
                                                onClick={handleValidatePromo}
                                                className="shrink-0 bg-slate-900 dark:bg-blue-600 text-white px-5 py-3 rounded-2xl text-xs font-black active:scale-95 transition-transform disabled:opacity-60"
                                            >
                                                {isValidatingPromo ? 'Validando...' : 'Validar'}
                                            </button>
                                        </div>
                                        {promoError && (
                                            <p className="text-[11px] font-bold text-red-500 mt-1 pl-1">{promoError}</p>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="space-y-2 pb-16">
                                <div className="flex items-center gap-1.5 text-[10px] font-black uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                    <Truck size={14} className="text-blue-600 dark:text-blue-400" />
                                    <span>Ubicación (Envíos hasta la puerta de su casa)</span>
                                </div>
                                <p className="text-[11px] font-semibold text-slate-500 dark:text-slate-400">
                                    Desliza el selector para elegir tu municipio o departamento. (A partir de 5 kg se aplica un cargo extra por peso).
                                </p>
                                <div className="relative">
                                    <button
                                        type="button"
                                        onClick={() => setIsPickerOpen(!isPickerOpen)}
                                        className="w-full flex items-center justify-between gap-2 bg-slate-50 dark:bg-neutral-950 border border-slate-200 dark:border-neutral-800 rounded-2xl px-3.5 py-3 text-left"
                                    >
                                        <div className="flex items-center gap-2 min-w-0">
                                            <MapPin size={16} className="text-slate-400 shrink-0" />
                                            <span className={`text-xs sm:text-sm font-bold truncate ${shipping ? 'text-black dark:text-white' : 'text-slate-400'}`}>
                                                {currentLocationLabel || 'Seleccionar municipio / departamento'}
                                            </span>
                                        </div>
                                        <ChevronDown size={16} className={`text-slate-400 shrink-0 transition-transform ${isPickerOpen ? 'rotate-180' : ''}`} />
                                    </button>
                                    <WheelPicker
                                        items={locationLabels}
                                        selectedValue={currentLocationLabel || locationLabels[0]}
                                        onSelect={handleSelectLocation}
                                        isOpen={isPickerOpen}
                                        onClose={() => setIsPickerOpen(false)}
                                    />
                                </div>
                                {shipping && (
                                    <button
                                        type="button"
                                        onClick={() => setShipping(null)}
                                        className="text-[11px] font-bold text-red-500 hover:underline pl-1"
                                    >
                                        Quitar envío seleccionado
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="p-4 border-t border-slate-200/70 dark:border-neutral-800 bg-white dark:bg-black shrink-0">
                            <button
                                type="button"
                                onClick={handleSave}
                                className="w-full py-3.5 bg-slate-950 dark:bg-blue-600 hover:bg-slate-900 dark:hover:bg-blue-700 text-white rounded-2xl text-sm font-black shadow-lg active:scale-[0.98] transition-transform"
                            >
                                Guardar Perfil
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProductModal = ({ product, mode, userProfile, shipping, onClose, onAddToCart, onOpenProfile }) => {
            const isPackage = mode === 'paquetes' || Boolean(product.whatsappOnly);
            const images = product.images && product.images.length > 0 ? product.images : [product.image, product.image, product.image];
            const [currentImgIndex, setCurrentImgIndex] = useState(0);
            const [showCareDetails, setShowCareDetails] = useState(false);
            const [selectedSize, setSelectedSize] = useState(product.sizes ? product.sizes[0] : '');
            const [colorMode, setColorMode] = useState('single'); // 'single' | 'multi'
            const [selectedColor, setSelectedColor] = useState(product.colors ? product.colors[0] : null);
            const [quantity, setQuantity] = useState(1);
            const [openPicker, setOpenPicker] = useState(null); // 'size' | 'qty' | null
            const [multiCounts, setMultiCounts] = useState(() => {
                const initial = {};
                if (product.colors) {
                    product.colors.forEach((c) => {
                        initial[c.name] = 0;
                    });
                }
                return initial;
            });
            const [dataWarning, setDataWarning] = useState(false);

            const totalMultiQty = Object.values(multiCounts).reduce((sum, n) => sum + n, 0);
            const quantityLabels = QUANTITY_OPTIONS.map(n => `${n} Und.`);

            const resetMultiCounts = () => {
                const cleared = {};
                if (product.colors) {
                    product.colors.forEach((c) => {
                        cleared[c.name] = 0;
                    });
                }
                setMultiCounts(cleared);
            };

            const handlePrevImg = (e) => {
                e.stopPropagation();
                setCurrentImgIndex((prev) => (prev === 0 ? images.length - 1 : prev - 1));
            };

            const handleNextImg = (e) => {
                e.stopPropagation();
                setCurrentImgIndex((prev) => (prev === images.length - 1 ? 0 : prev + 1));
            };

            const isLightColor = (hex) => {
                const lightHexes = ['#d1d5db', '#fef3c7', '#ffffff', '#f8fafc', '#e2e8f0'];
                return lightHexes.includes((hex || '').toLowerCase());
            };

            const updateMultiQty = (colorName, delta) => {
                setMultiCounts(prev => {
                    const current = prev[colorName] || 0;
                    const next = Math.max(0, current + delta);
                    const otherTotal = Object.entries(prev).reduce((sum, [k, v]) => (k === colorName ? sum : sum + v), 0);
                    if (otherTotal + next > 12) return prev;
                    return { ...prev, [colorName]: next };
                });
            };

            const handleAddUnit = () => {
                if (colorMode === 'single') {
                    onAddToCart(product, quantity, selectedColor, selectedSize);
                    onClose();
                } else {
                    if (totalMultiQty <= 0) return;
                    product.colors.forEach(c => {
                        const qty = multiCounts[c.name] || 0;
                        if (qty > 0) {
                            onAddToCart(product, qty, c, selectedSize);
                        }
                    });
                    onClose();
                }
            };

            const fullName = `${userProfile?.firstName || ''} ${userProfile?.lastName || ''}`.trim();
            const exactAddress = (userProfile?.address || '').trim();

            const handlePackageWhatsApp = () => {
                if (!fullName || !exactAddress) {
                    setDataWarning(true);
                    return;
                }
                setDataWarning(false);

                generateAndSendOrderJPG({
                    customerName: fullName,
                    customerAddress: exactAddress,
                    shippingLocation: shipping ? shipping.name : 'Envío incluido',
                    items: [{
                        title: product.title,
                        quantity: 1,
                        unitPrice: product.numericPrice,
                        description: product.description || 'Paquete especial DICED'
                    }],
                    subtotal: product.numericPrice,
                    volumeDiscountLabel: '',
                    volumeDiscountAmount: 0,
                    activePromo: null,
                    promoDiscountAmount: 0,
                    shippingBasePrice: 0,
                    totalWeightKg: 0,
                    weightSurcharge: 0,
                    total: product.numericPrice
                });
            };

            return (
                <div className="fixed inset-0 z-[105] bg-white dark:bg-black flex flex-col h-[100dvh] overflow-hidden">
                    <div className="modal-enter w-full h-full max-w-4xl mx-auto px-3.5 sm:px-6 pt-2.5 pb-3 sm:py-5 flex flex-col md:grid md:grid-cols-2 gap-2.5 sm:gap-3 md:gap-8 md:items-center overflow-hidden">
                        {/* Foto principal flexible: se adapta automáticamente para que el botón siempre quepa sin deslizar */}
                        <div className="w-full flex-1 min-h-[120px] max-h-[40dvh] md:max-h-[75dvh] md:aspect-square rounded-[1.5rem] sm:rounded-[1.75rem] overflow-hidden bg-slate-100 dark:bg-neutral-950 border border-slate-200/70 dark:border-neutral-800 relative shadow-sm shrink">
                            <img
                                src={images[currentImgIndex]}
                                alt={product.title}
                                className="w-full h-full object-cover"
                            />

                            <button
                                type="button"
                                onClick={onClose}
                                aria-label="Cerrar producto"
                                className="absolute top-2.5 right-2.5 z-20 w-9 h-9 sm:w-10 sm:h-10 bg-white dark:bg-neutral-900 rounded-full text-black dark:text-white shadow-md flex items-center justify-center hover:bg-slate-100 dark:hover:bg-neutral-800 transition-colors active:scale-95"
                            >
                                <X size={18} />
                            </button>

                            {isPackage && product.savings && (
                                <div className="absolute top-2.5 left-2.5 bg-blue-600 text-white text-[11px] font-black px-2.5 py-1 rounded-full shadow-md z-10">
                                    -{product.savings} AHORRO
                                </div>
                            )}

                            {images.length > 1 && (
                                <>
                                    <button
                                        type="button"
                                        onClick={handlePrevImg}
                                        aria-label="Imagen anterior"
                                        className="absolute left-2.5 top-1/2 -translate-y-1/2 z-10 w-8 h-8 sm:w-9 sm:h-9 bg-white/95 dark:bg-neutral-900/95 rounded-full text-black dark:text-white shadow-md flex items-center justify-center active:scale-90 transition-transform"
                                    >
                                        <ChevronLeft size={16} />
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleNextImg}
                                        aria-label="Siguiente imagen"
                                        className="absolute right-2.5 top-1/2 -translate-y-1/2 z-10 w-8 h-8 sm:w-9 sm:h-9 bg-white/95 dark:bg-neutral-900/95 rounded-full text-black dark:text-white shadow-md flex items-center justify-center active:scale-90 transition-transform"
                                    >
                                        <ChevronRight size={16} />
                                    </button>
                                    <div className="absolute bottom-2.5 left-1/2 -translate-x-1/2 z-10 flex items-center gap-1.5">
                                        {images.map((_, idx) => (
                                            <button
                                                key={idx}
                                                type="button"
                                                onClick={() => setCurrentImgIndex(idx)}
                                                aria-label={`Ver foto ${idx + 1}`}
                                                className={`h-1.5 sm:h-2 rounded-full transition-all ${
                                                    currentImgIndex === idx
                                                        ? 'w-5 bg-white shadow-sm'
                                                        : 'w-1.5 sm:w-2 bg-white/60'
                                                }`}
                                            />
                                        ))}
                                    </div>
                                </>
                            )}
                        </div>

                        {/* Controles compactos en el orden exacto de tu diseño */}
                        <div className="flex flex-col space-y-2 xs:space-y-2.5 sm:space-y-3 shrink-0">
                            {/* 1. Título y Precio */}
                            <div>
                                <h2 className="text-lg xs:text-xl sm:text-2xl font-black text-black dark:text-white tracking-tight leading-tight">
                                    {product.title}
                                </h2>
                                <p className="text-base xs:text-lg sm:text-xl font-black text-slate-800 dark:text-blue-400 leading-tight mt-0.5">
                                    C${product.numericPrice.toFixed(2)}
                                </p>
                            </div>

                            {isPackage ? (
                                <div className="space-y-3">
                                    <div className="p-3 sm:p-4 rounded-2xl bg-slate-50 dark:bg-neutral-950 border border-slate-200/70 dark:border-neutral-800">
                                        <p className="text-[10px] font-black uppercase tracking-wider text-blue-600 dark:text-blue-400 mb-1">
                                            Incluye
                                        </p>
                                        <p className="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 leading-relaxed">
                                            {product.description}
                                        </p>
                                    </div>

                                    {(!fullName || !exactAddress) && (
                                        <div className={`px-3 py-2 rounded-2xl border flex items-center justify-between gap-2 ${dataWarning ? 'bg-red-50 dark:bg-red-950/50 border-red-300 dark:border-red-800' : 'bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-800/60'}`}>
                                            <div className="flex items-center gap-2 min-w-0">
                                                <User size={14} className={dataWarning ? 'text-red-600 dark:text-red-400 shrink-0' : 'text-amber-600 dark:text-amber-400 shrink-0'} />
                                                <span className={`text-[11px] font-black truncate ${dataWarning ? 'text-red-700 dark:text-red-300' : 'text-amber-800 dark:text-amber-300'}`}>
                                                    Completa tu nombre y dirección
                                                </span>
                                            </div>
                                            <button
                                                type="button"
                                                onClick={() => { setDataWarning(false); onOpenProfile(); }}
                                                className={`shrink-0 px-2.5 py-1 rounded-xl text-[10px] font-black text-white active:scale-95 ${dataWarning ? 'bg-red-600' : 'bg-amber-600'}`}
                                            >
                                                Perfil
                                            </button>
                                        </div>
                                    )}

                                    <button
                                        type="button"
                                        onClick={handlePackageWhatsApp}
                                        className="w-full py-3.5 bg-[#25D366] hover:bg-[#20bd5a] text-white rounded-2xl font-black text-xs sm:text-sm shadow-lg shadow-[#25D366]/25 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
                                    >
                                        <MessageCircle size={18} />
                                        <span>PEDIR VÍA WHATSAPP (JPG)</span>
                                    </button>
                                </div>
                            ) : (
                                <>
                                    {/* 2. Acordeón: Detalles de la tela y cuidados */}
                                    {(product.fabric || product.care) && (
                                        <div className="rounded-2xl bg-slate-100 dark:bg-neutral-950 border border-slate-200/80 dark:border-neutral-800 overflow-hidden">
                                            <button
                                                type="button"
                                                onClick={() => setShowCareDetails(!showCareDetails)}
                                                className="w-full flex items-center justify-between px-3.5 py-2 sm:py-2.5 text-left"
                                            >
                                                <div className="flex items-center gap-2">
                                                    <Sparkles size={15} className="text-blue-600 dark:text-blue-400 shrink-0" />
                                                    <span className="text-xs font-black text-slate-800 dark:text-slate-100">
                                                        Detalles de la tela y cuidados
                                                    </span>
                                                </div>
                                                <ChevronDown
                                                    size={15}
                                                    className={`text-slate-500 transition-transform duration-200 ${showCareDetails ? 'rotate-180' : ''}`}
                                                />
                                            </button>
                                            {showCareDetails && (
                                                <div className="px-3.5 pb-2.5 pt-1 border-t border-slate-200/70 dark:border-neutral-800 space-y-0.5 max-h-20 overflow-y-auto hide-scrollbar">
                                                    {product.fabric && (
                                                        <p className="text-[11px] font-black text-slate-800 dark:text-slate-100">
                                                            {product.fabric}
                                                        </p>
                                                    )}
                                                    {product.care && (
                                                        <p className="text-[10px] font-semibold text-slate-600 dark:text-slate-400 leading-snug">
                                                            {product.care}
                                                        </p>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* 3. Selector de modo: 1 COLOR | MÚLTIPLES (sin WhatsApp) */}
                                    {product.colors && (
                                        <div className="space-y-2">
                                            <div className="bg-slate-100 dark:bg-neutral-900 border border-slate-200/70 dark:border-neutral-800 p-1 rounded-2xl grid grid-cols-2 gap-1">
                                                <button
                                                    type="button"
                                                    onClick={() => { setColorMode('single'); setOpenPicker(null); }}
                                                    className={`py-1.5 sm:py-2 rounded-xl text-[10px] sm:text-[11px] font-black uppercase tracking-wider transition-all ${
                                                        colorMode === 'single'
                                                            ? 'bg-white dark:bg-black text-blue-700 dark:text-blue-400 shadow-sm'
                                                            : 'text-slate-500 dark:text-slate-400'
                                                    }`}
                                                >
                                                    1 COLOR
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => { setColorMode('multi'); setOpenPicker(null); }}
                                                    className={`py-1.5 sm:py-2 rounded-xl text-[10px] sm:text-[11px] font-black uppercase tracking-wider transition-all ${
                                                        colorMode === 'multi'
                                                            ? 'bg-white dark:bg-black text-blue-700 dark:text-blue-400 shadow-sm'
                                                            : 'text-slate-500 dark:text-slate-400'
                                                    }`}
                                                >
                                                    MÚLTIPLES
                                                </button>
                                            </div>

                                            {/* 4. Colores disponibles */}
                                            <div>
                                                <span className="block text-[9.5px] font-black uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                                                    COLORES DISPONIBLES
                                                </span>

                                                {colorMode === 'single' ? (
                                                    <div className="flex flex-wrap items-center gap-2.5">
                                                        {product.colors.map(color => {
                                                            const active = selectedColor?.name === color.name;
                                                            return (
                                                                <button
                                                                    key={color.name}
                                                                    type="button"
                                                                    onClick={() => setSelectedColor(color)}
                                                                    title={color.name}
                                                                    aria-label={color.name}
                                                                    className={`w-8 h-8 xs:w-9 xs:h-9 rounded-full flex items-center justify-center transition-transform active:scale-95 ${
                                                                        active
                                                                            ? 'ring-2 ring-offset-2 ring-slate-900 dark:ring-white dark:ring-offset-black scale-105'
                                                                            : 'border border-slate-300 dark:border-neutral-700'
                                                                    }`}
                                                                    style={{ backgroundColor: color.hex }}
                                                                >
                                                                    {active && (
                                                                        <Check
                                                                            size={14}
                                                                            className={isLightColor(color.hex) ? 'text-black' : 'text-white'}
                                                                        />
                                                                    )}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                ) : (
                                                    <div className="space-y-1.5">
                                                        <div className="flex flex-wrap items-center gap-2.5">
                                                            {product.colors.map(color => {
                                                                const count = multiCounts[color.name] || 0;
                                                                return (
                                                                    <button
                                                                        key={color.name}
                                                                        type="button"
                                                                        onClick={() => updateMultiQty(color.name, 1)}
                                                                        title={`Añadir 1 ${color.name}`}
                                                                        aria-label={`Añadir 1 ${color.name}`}
                                                                        className={`relative w-8 h-8 xs:w-9 xs:h-9 rounded-full flex items-center justify-center transition-transform active:scale-90 ${
                                                                            count > 0
                                                                                ? 'ring-2 ring-offset-2 ring-blue-600 dark:ring-blue-400 dark:ring-offset-black scale-105'
                                                                                : 'border border-slate-300 dark:border-neutral-700'
                                                                        }`}
                                                                        style={{ backgroundColor: color.hex }}
                                                                    >
                                                                        <Plus
                                                                            size={13}
                                                                            className={`opacity-80 ${isLightColor(color.hex) ? 'text-black' : 'text-white'}`}
                                                                        />
                                                                        {count > 0 && (
                                                                            <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-blue-600 text-white text-[9px] font-black flex items-center justify-center shadow-sm border-2 border-white dark:border-black">
                                                                                {count}
                                                                            </span>
                                                                        )}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>

                                                        {totalMultiQty === 0 ? (
                                                            <p className="text-[10px] font-bold text-slate-500 dark:text-slate-400">
                                                                Toca cada color para añadir +1 unidad (máx. 12).
                                                            </p>
                                                        ) : (
                                                            <div className="space-y-1">
                                                                <div className="flex flex-wrap gap-1 max-h-14 overflow-y-auto hide-scrollbar">
                                                                    {product.colors.filter(c => (multiCounts[c.name] || 0) > 0).map(color => (
                                                                        <div
                                                                            key={color.name}
                                                                            className="inline-flex items-center gap-1 bg-slate-100 dark:bg-neutral-900 border border-slate-200 dark:border-neutral-800 rounded-full pl-1.5 pr-1 py-0.5"
                                                                        >
                                                                            <span
                                                                                className="w-2.5 h-2.5 rounded-full border border-slate-300 dark:border-neutral-700 shrink-0"
                                                                                style={{ backgroundColor: color.hex }}
                                                                            />
                                                                            <span className="text-[10px] font-black text-slate-800 dark:text-slate-100">
                                                                                {color.name} x{multiCounts[color.name]}
                                                                            </span>
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => updateMultiQty(color.name, -1)}
                                                                                aria-label={`Quitar 1 ${color.name}`}
                                                                                className="w-4 h-4 rounded-full bg-white dark:bg-black text-slate-600 dark:text-slate-300 flex items-center justify-center border border-slate-200 dark:border-neutral-700 active:scale-90"
                                                                            >
                                                                                <Minus size={9} />
                                                                            </button>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                                <div className="flex items-center justify-between text-[10px] font-bold text-slate-500 dark:text-slate-400">
                                                                    <span>Total: {totalMultiQty}/12 Und.</span>
                                                                    <button
                                                                        type="button"
                                                                        onClick={resetMultiCounts}
                                                                        className="text-red-500 hover:underline font-black"
                                                                    >
                                                                        Limpiar
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {/* 5. TALLA y CANTIDAD lado a lado (ruletas hacia arriba para no cortarse) */}
                                    <div className="grid grid-cols-2 gap-2.5">
                                        {product.sizes && (
                                            <div className="relative space-y-1">
                                                <span className="block text-[9.5px] font-black uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                                    TALLA
                                                </span>
                                                <button
                                                    type="button"
                                                    onClick={() => setOpenPicker(openPicker === 'size' ? null : 'size')}
                                                    className={`w-full flex items-center justify-between px-3.5 py-2 sm:py-2.5 rounded-2xl bg-slate-100 dark:bg-neutral-950 border transition-colors ${
                                                        openPicker === 'size'
                                                            ? 'border-blue-500 ring-2 ring-blue-500/20'
                                                            : 'border-slate-200 dark:border-neutral-800'
                                                    }`}
                                                >
                                                    <span className="text-xs sm:text-sm font-black text-black dark:text-white">{selectedSize}</span>
                                                    <ChevronDown size={15} className={`text-slate-500 transition-transform duration-200 ${openPicker === 'size' ? 'rotate-180 text-blue-600' : ''}`} />
                                                </button>
                                                <WheelPicker
                                                    items={product.sizes}
                                                    selectedValue={selectedSize}
                                                    onSelect={setSelectedSize}
                                                    isOpen={openPicker === 'size'}
                                                    onClose={() => setOpenPicker(null)}
                                                    openUp={true}
                                                />
                                            </div>
                                        )}

                                        <div className="relative space-y-1">
                                            <span className="block text-[9.5px] font-black uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                                CANTIDAD
                                            </span>
                                            {colorMode === 'single' ? (
                                                <>
                                                    <button
                                                        type="button"
                                                        onClick={() => setOpenPicker(openPicker === 'qty' ? null : 'qty')}
                                                        className={`w-full flex items-center justify-between px-3.5 py-2 sm:py-2.5 rounded-2xl bg-slate-100 dark:bg-neutral-950 border transition-colors ${
                                                            openPicker === 'qty'
                                                                ? 'border-blue-500 ring-2 ring-blue-500/20'
                                                                : 'border-slate-200 dark:border-neutral-800'
                                                        }`}
                                                    >
                                                        <span className="text-xs sm:text-sm font-black text-blue-700 dark:text-blue-400">{quantity} Und.</span>
                                                        <ChevronDown size={15} className={`text-slate-500 transition-transform duration-200 ${openPicker === 'qty' ? 'rotate-180 text-blue-600' : ''}`} />
                                                    </button>
                                                    <WheelPicker
                                                        items={quantityLabels}
                                                        selectedValue={`${quantity} Und.`}
                                                        onSelect={(val) => setQuantity(parseInt(val, 10) || 1)}
                                                        isOpen={openPicker === 'qty'}
                                                        onClose={() => setOpenPicker(null)}
                                                        openUp={true}
                                                    />
                                                </>
                                            ) : (
                                                <div className="w-full flex items-center justify-between px-3.5 py-2 sm:py-2.5 rounded-2xl bg-slate-100 dark:bg-neutral-950 border border-slate-200 dark:border-neutral-800">
                                                    <span className="text-xs sm:text-sm font-black text-blue-700 dark:text-blue-400">{totalMultiQty} Und.</span>
                                                    <span className="text-[10px] font-bold text-slate-400">Multi</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* 6. Botón AGREGAR AL CARRITO siempre visible */}
                                    <button
                                        type="button"
                                        disabled={colorMode === 'multi' && totalMultiQty === 0}
                                        onClick={handleAddUnit}
                                        className="w-full py-3 xs:py-3.5 bg-[#0f172a] dark:bg-blue-600 hover:bg-slate-900 dark:hover:bg-blue-700 disabled:opacity-40 text-white rounded-2xl font-black text-xs sm:text-sm uppercase tracking-wider shadow-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
                                    >
                                        <ShoppingCart size={17} />
                                        <span>AGREGAR AL CARRITO</span>
                                    </button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const CartModal = ({ cartItems, shipping, userProfile, activePromo, setActivePromo, onClose, updateQuantity, removeItem, onOpenProfile }) => {
            const [promoInput, setPromoInput] = useState('');
            const [promoError, setPromoError] = useState('');
            const [isValidatingPromo, setIsValidatingPromo] = useState(false);
            const [dataWarning, setDataWarning] = useState(false);

            const handleApplyPromo = async () => {
                if (!promoInput.trim()) {
                    setPromoError('Ingresa un código.');
                    return;
                }
                setIsValidatingPromo(true);
                setPromoError('');
                const result = await validateCouponInGoogleSheets(promoInput);
                setIsValidatingPromo(false);

                if (result.valid) {
                    setActivePromo({ code: result.code, discount: result.discount });
                    setPromoError('');
                } else {
                    setActivePromo(null);
                    setPromoError(result.message || 'Código no válido o no disponible.');
                }
            };

            const removePromo = () => {
                setActivePromo(null);
                setPromoInput('');
                setPromoError('');
            };

            const totalItemsCount = cartItems.reduce((acc, item) => acc + item.quantity, 0);
            const subtotal = cartItems.reduce((total, item) => total + (item.numericPrice * item.quantity), 0);

            const totalWeightKg = (totalItemsCount * 220) / 1000;
            const extraFiveKgBlocks = Math.floor(totalWeightKg / 5);
            const hasWeightSurcharge = shipping && extraFiveKgBlocks > 0;
            const weightSurcharge = hasWeightSurcharge ? (shipping.price * (0.49 * extraFiveKgBlocks)) : 0;

            let volumeDiscountPercent = 0;
            if (totalItemsCount >= 10) volumeDiscountPercent = 0.15;
            else if (totalItemsCount >= 4) volumeDiscountPercent = 0.10;

            const hasVolumeDiscount = volumeDiscountPercent > 0;
            const volumeDiscountAmount = subtotal * volumeDiscountPercent;
            const volumeDiscountLabel = volumeDiscountPercent === 0.15 ? '15%' : '10%';

            const promoDiscountAmount = activePromo ? subtotal * (activePromo.discount / 100) : 0;
            const shippingCost = shipping ? (shipping.price + weightSurcharge) : 0;
            const total = subtotal - volumeDiscountAmount - promoDiscountAmount + shippingCost;
            const fullName = `${userProfile?.firstName || ''} ${userProfile?.lastName || ''}`.trim();
            const exactAddress = (userProfile?.address || '').trim();

            let orderSummary = (fullName ? `Cliente: ${fullName} - ` : '') + cartItems.map(item => item.quantity + "x " + item.title + (item.size ? ` (${item.size})` : '') + (item.colorName ? ` [${item.colorName}]` : '')).join(', ');
            if (activePromo) orderSummary += ` (Cupón ${activePromo.code})`;
            if (shipping) orderSummary += ` + Envío (${shipping.name}${hasWeightSurcharge ? ' +Peso' : ''})`;

            const encodedDescription = encodeURIComponent(orderSummary.substring(0, 100));
            const poketBaseURL = "https://pagoconpoket.com/merchant/c206c5cd-4c91-4bc6-977b-ce7d3541c8d1/link/21559d05-ff7e-4f52-a3f4-5f9a1cc932cc";
            const poketLink = poketBaseURL + "?currency=NIO&amount=" + total.toFixed(2) + "&description=" + encodedDescription;

            const handleWhatsAppOrder = () => {
                if (!fullName || !exactAddress) {
                    setDataWarning(true);
                    return;
                }
                setDataWarning(false);

                const jpgItems = cartItems.map(item => {
                    const details = [];
                    if (item.size) details.push(`Talla: ${item.size}`);
                    if (item.colorName) details.push(`Color: ${item.colorName}`);
                    return {
                        title: item.title,
                        quantity: item.quantity,
                        unitPrice: item.numericPrice,
                        description: details.join(' • ') || 'Prenda por unidad'
                    };
                });

                generateAndSendOrderJPG({
                    customerName: fullName,
                    customerAddress: exactAddress,
                    shippingLocation: shipping ? shipping.name : '',
                    items: jpgItems,
                    subtotal,
                    volumeDiscountLabel,
                    volumeDiscountAmount,
                    activePromo,
                    promoDiscountAmount,
                    shippingBasePrice: shipping ? shipping.price : 0,
                    totalWeightKg,
                    weightSurcharge,
                    total
                });
            };

            const handleCardOrder = () => {
                const now = new Date();
                const dateStr = now.toLocaleString('es-NI', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
                const fullAddr = exactAddress
                    ? (shipping ? `${shipping.name} — ${exactAddress}` : exactAddress)
                    : (shipping ? shipping.name : 'No especificada');
                const detalle = cartItems.map(item => `${item.quantity}x ${item.title}${item.size ? ` (${item.size})` : ''}${item.colorName ? ` [${item.colorName}]` : ''}`).join(' | ');

                sendOrderToGoogleSheets({
                    fecha: dateStr,
                    codigoPedido: generateOrderCode(total),
                    nombreCliente: fullName || 'Cliente DICED',
                    codigoDescuento: activePromo ? `${activePromo.code} (-${activePromo.discount}%)` : 'Ninguno',
                    direccionExacta: fullAddr,
                    totalPagar: Number(total.toFixed(2)),
                    detallePedido: detalle,
                    metodoPago: 'Tarjeta (Poket)'
                });

                setTimeout(() => {
                    window.location.href = poketLink;
                }, 250);
            };

            return (
                <div className="fixed inset-0 z-[110] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/70">
                    <div className="absolute inset-0" onClick={onClose}></div>
                    <SurfaceCard className="modal-enter w-full sm:max-w-lg cart-h rounded-t-[2rem] sm:rounded-[2.25rem] p-4 sm:p-6 relative z-10 flex flex-col shadow-2xl overflow-hidden">
                        <div className="flex justify-between items-center mb-3 shrink-0">
                            <h2 className="text-lg sm:text-xl font-black text-black dark:text-white tracking-tight">Tu Pedido</h2>
                            <button onClick={onClose} aria-label="Cerrar carrito" className="p-2 bg-slate-100 dark:bg-neutral-900 rounded-full text-black dark:text-white hover:bg-slate-200 dark:hover:bg-neutral-800 transition-colors">
                                <X size={18}/>
                            </button>
                        </div>

                        {cartItems.length === 0 ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-center py-10">
                                <div className="w-16 h-16 rounded-full bg-slate-100 dark:bg-neutral-900 flex items-center justify-center text-slate-400 mb-3">
                                    <ShoppingCart size={28} />
                                </div>
                                <p className="text-sm font-black text-slate-700 dark:text-slate-200">Tu carrito está vacío</p>
                                <p className="text-xs font-semibold text-slate-400 mt-1">Agrega prendas del catálogo para armar tu pedido.</p>
                            </div>
                        ) : (
                            <>
                                <div className="flex-1 overflow-y-auto space-y-2.5 pr-0.5 hide-scrollbar smooth-scroll mb-3">
                                    {cartItems.map(item => (
                                        <div key={item.cartItemId} className="bg-slate-50 dark:bg-neutral-950 border border-slate-200/70 dark:border-neutral-800 rounded-2xl p-2.5 flex items-center gap-3">
                                            <img src={item.image} alt={item.title} className="w-14 h-14 rounded-xl object-cover bg-white shrink-0 border border-slate-200/60 dark:border-neutral-800" />
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-start justify-between gap-2">
                                                    <h3 className="text-xs sm:text-sm font-black text-black dark:text-white truncate">{item.title}</h3>
                                                    <button onClick={() => removeItem(item.cartItemId)} aria-label="Eliminar" className="text-slate-400 hover:text-red-500 p-0.5 shrink-0">
                                                        <Trash2 size={14} />
                                                    </button>
                                                </div>
                                                <div className="flex flex-wrap items-center gap-1.5 mt-0.5">
                                                    {item.size && (
                                                        <span className="text-[10px] font-black px-1.5 py-0.5 rounded-md bg-white dark:bg-neutral-900 text-slate-700 dark:text-slate-200 border border-slate-200/70 dark:border-neutral-700">
                                                            Talla {item.size}
                                                        </span>
                                                    )}
                                                    {item.colorName && (
                                                        <span className="inline-flex items-center gap-1 text-[10px] font-bold text-slate-600 dark:text-slate-300">
                                                            {item.colorHex && <span className="w-2.5 h-2.5 rounded-full border border-slate-300 inline-block" style={{ backgroundColor: item.colorHex }} />}
                                                            {item.colorName}
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="flex items-center justify-between mt-2">
                                                    <div className="flex items-center gap-2 bg-white dark:bg-black rounded-full px-2 py-0.5 border border-slate-200 dark:border-neutral-800">
                                                        <button onClick={() => updateQuantity(item.cartItemId, -1)} className="p-0.5 text-slate-600 dark:text-slate-300 active:scale-90"><Minus size={12}/></button>
                                                        <span className="text-xs font-black text-black dark:text-white min-w-[16px] text-center">{item.quantity}</span>
                                                        <button onClick={() => updateQuantity(item.cartItemId, 1)} className="p-0.5 text-slate-600 dark:text-slate-300 active:scale-90"><Plus size={12}/></button>
                                                    </div>
                                                    <span className="text-xs sm:text-sm font-black text-blue-700 dark:text-blue-400">
                                                        C${(item.numericPrice * item.quantity).toFixed(2)}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="shrink-0 space-y-2.5 pt-2 border-t border-slate-200/70 dark:border-neutral-800">
                                    {activePromo ? (
                                        <div className="flex items-center justify-between bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800/70 rounded-xl px-3 py-2">
                                            <div className="flex items-center gap-1.5 text-emerald-700 dark:text-emerald-300">
                                                <Tag size={14} />
                                                <span className="text-xs font-black">Código {activePromo.code} ({activePromo.discount}%)</span>
                                            </div>
                                            <button onClick={removePromo} className="text-[10px] font-black text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/60 px-2.5 py-1 rounded-full">
                                                QUITAR
                                            </button>
                                        </div>
                                    ) : (
                                        <div>
                                            <div className="flex gap-1.5">
                                                <input
                                                    type="text"
                                                    disabled={isValidatingPromo}
                                                    value={promoInput}
                                                    onChange={(e) => { setPromoInput(e.target.value.toUpperCase()); setPromoError(''); }}
                                                    placeholder="Código de descuento"
                                                    className="flex-1 min-w-0 bg-slate-50 dark:bg-neutral-950 border border-slate-200 dark:border-neutral-800 rounded-xl px-3 py-2 text-xs font-bold text-black dark:text-white focus:outline-none focus:border-blue-500 uppercase disabled:opacity-60"
                                                />
                                                <button disabled={isValidatingPromo} onClick={handleApplyPromo} className="shrink-0 bg-slate-900 dark:bg-blue-600 text-white px-3.5 py-2 rounded-xl text-xs font-black active:scale-95 disabled:opacity-60">
                                                    {isValidatingPromo ? '...' : 'Aplicar'}
                                                </button>
                                            </div>
                                            {promoError && <p className="text-[10px] font-bold text-red-500 mt-1 pl-1">{promoError}</p>}
                                        </div>
                                    )}

                                    <div className="space-y-1 text-xs">
                                        <div className="flex justify-between font-bold text-slate-600 dark:text-slate-300">
                                            <span>Subtotal ({totalItemsCount} {totalItemsCount === 1 ? 'prenda' : 'prendas'})</span>
                                            <span>C${subtotal.toFixed(2)}</span>
                                        </div>
                                        {hasVolumeDiscount && (
                                            <div className="flex justify-between font-black text-indigo-600 dark:text-indigo-400">
                                                <span>Volumen (-{volumeDiscountLabel})</span>
                                                <span>-C${volumeDiscountAmount.toFixed(2)}</span>
                                            </div>
                                        )}
                                        {activePromo && (
                                            <div className="flex justify-between font-black text-emerald-600 dark:text-emerald-400">
                                                <span>Cupón {activePromo.code} (-{activePromo.discount}%)</span>
                                                <span>-C${promoDiscountAmount.toFixed(2)}</span>
                                            </div>
                                        )}
                                        <div className="bg-slate-50 dark:bg-neutral-950 border border-slate-200/70 dark:border-neutral-800 rounded-xl p-2.5 mt-1">
                                            <div className="flex items-center justify-between gap-2">
                                                <div className="flex items-center gap-1.5 min-w-0">
                                                    <Truck size={14} className="text-blue-600 dark:text-blue-400 shrink-0" />
                                                    <span className="text-xs font-black text-slate-800 dark:text-white truncate">
                                                        {shipping ? `Envío (${shipping.name})` : 'Sin envío seleccionado'}
                                                    </span>
                                                    <button onClick={onOpenProfile} className="shrink-0 text-[10px] font-black text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-neutral-900 px-2 py-0.5 rounded-full">
                                                        {shipping ? 'Cambiar' : 'Elegir'}
                                                    </button>
                                                </div>
                                                <span className="text-xs font-black text-blue-700 dark:text-blue-400 shrink-0">
                                                    {shipping ? `C$${shipping.price.toFixed(2)}` : 'C$0.00'}
                                                </span>
                                            </div>
                                            <div className="text-[10px] font-bold text-slate-500 dark:text-slate-400 mt-1">
                                                Peso del paquete ({totalItemsCount} {totalItemsCount === 1 ? 'prenda' : 'prendas'}): {totalWeightKg.toFixed(2)} kg
                                            </div>
                                            {hasWeightSurcharge && (
                                                <div className="flex justify-between text-[10px] font-black text-amber-600 dark:text-amber-400 mt-0.5">
                                                    <span>Cargo extra por peso (+{extraFiveKgBlocks * 5} kg)</span>
                                                    <span>+C${weightSurcharge.toFixed(2)}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {(!fullName || !exactAddress) && (
                                        <div className={`px-3 py-2 rounded-xl border flex items-center justify-between gap-2 ${dataWarning ? 'bg-red-50 dark:bg-red-950/50 border-red-300 dark:border-red-800' : 'bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-800/60'}`}>
                                            <div className="flex items-center gap-1.5 min-w-0">
                                                <User size={14} className={dataWarning ? 'text-red-600 dark:text-red-400 shrink-0' : 'text-amber-600 dark:text-amber-400 shrink-0'} />
                                                <span className={`text-[10px] sm:text-[11px] font-black truncate ${dataWarning ? 'text-red-700 dark:text-red-300' : 'text-amber-800 dark:text-amber-300'}`}>
                                                    Falta nombre o dirección en tu perfil
                                                </span>
                                            </div>
                                            <button
                                                onClick={() => { setDataWarning(false); onOpenProfile(); }}
                                                className={`shrink-0 px-2.5 py-1 rounded-lg text-[10px] font-black text-white shadow-sm active:scale-95 ${dataWarning ? 'bg-red-600 hover:bg-red-700' : 'bg-amber-600 hover:bg-amber-700'}`}
                                            >
                                                Completar
                                            </button>
                                        </div>
                                    )}

                                    <div className="flex items-center justify-between pt-1">
                                        <span className="text-base font-black text-black dark:text-white">Total</span>
                                        <span className="text-xl font-black text-blue-700 dark:text-blue-400">C${total.toFixed(2)}</span>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2 pt-0.5">
                                        <button onClick={handleWhatsAppOrder} className="py-3 bg-[#25D366] hover:bg-[#20bd5a] shadow-md shadow-[#25D366]/25 rounded-2xl text-white font-extrabold text-[11px] sm:text-xs transition-transform flex flex-col items-center justify-center gap-0.5 active:scale-[0.98]">
                                            <MessageCircle size={18} />
                                            <span>PEDIR VÍA WHATSAPP</span>
                                            <span className="text-[9px] font-bold opacity-90">(Descarga JPG)</span>
                                        </button>
                                        <button onClick={handleCardOrder} className="py-3 bg-blue-600 hover:bg-blue-700 shadow-md shadow-blue-600/25 rounded-2xl text-white font-extrabold text-[11px] sm:text-xs transition-transform flex flex-col items-center justify-center gap-1 active:scale-[0.98]">
                                            <CreditCard size={18} />
                                            <span>PAGO TARJETA</span>
                                        </button>
                                    </div>
                                </div>
                            </>
                        )}
                    </SurfaceCard>
                </div>
            );
        };

        const SideMenu = memo(({ isOpen, onClose, onOpenSizeCalc, onOpenOrders, onOpenProfile, userProfile, darkMode, setDarkMode }) => {
            const fullName = `${userProfile?.firstName || ''} ${userProfile?.lastName || ''}`.trim();
            const waLink = "https://wa.me/50558081576?text=" + encodeURIComponent(`¡Hola DICED!${fullName ? ` Soy ${fullName}, me` : ' Me'} gustaría hacerles una consulta.`);

            return (
                <div className={`fixed inset-0 z-[120] transition-opacity duration-200 ${isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
                    <div className="absolute inset-0 bg-black/50" onClick={onClose}></div>

                    <div className={`gpu-layer absolute top-0 left-0 bottom-0 w-[80%] max-w-[290px] sm:max-w-[320px] bg-white dark:bg-black shadow-2xl border-r border-slate-200/70 dark:border-neutral-800 transition-transform duration-200 ease-out flex flex-col ${isOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-4 sm:p-5 flex justify-between items-center border-b border-slate-200/60 dark:border-neutral-800">
                            <div className="flex flex-col">
                                <h2 className="text-lg sm:text-xl font-black tracking-tighter text-black dark:text-white leading-none">DICED</h2>
                                <span className="text-[9px] font-bold tracking-widest text-slate-500 dark:text-slate-400 mt-0.5">MENÚ</span>
                            </div>
                            <button onClick={onClose} className="p-2 bg-slate-100 dark:bg-neutral-900 rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-neutral-800 transition-colors">
                                <X size={18}/>
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto smooth-scroll py-3.5 px-3 space-y-2">
                            <button onClick={() => { onOpenProfile(); onClose(); }} className="w-full flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-neutral-950 hover:bg-slate-100 dark:hover:bg-neutral-900 border border-slate-100 dark:border-neutral-800 transition-colors text-left active:scale-[0.99]">
                                <div className="w-10 h-10 rounded-xl bg-indigo-600/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0">
                                    <User size={20} />
                                </div>
                                <div className="flex flex-col overflow-hidden">
                                    <span className="font-black text-slate-700 dark:text-slate-200 text-sm truncate">{fullName || 'Mi Perfil'}</span>
                                    <span className="text-[10px] font-bold text-slate-400 dark:text-slate-500 truncate">Datos, envío y cupón</span>
                                </div>
                            </button>

                            <button onClick={() => { onOpenOrders(); onClose(); }} className="w-full flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-neutral-950 hover:bg-slate-100 dark:hover:bg-neutral-900 border border-slate-100 dark:border-neutral-800 transition-colors text-left active:scale-[0.99]">
                                <div className="w-10 h-10 rounded-xl bg-sky-600/10 dark:bg-sky-500/20 text-sky-600 dark:text-sky-400 flex items-center justify-center shrink-0">
                                    <Package size={20} />
                                </div>
                                <span className="font-black text-slate-700 dark:text-slate-200 text-sm">Pedidos</span>
                            </button>

                            <button onClick={() => { window.open(waLink, '_blank'); onClose(); }} className="w-full flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-neutral-950 hover:bg-slate-100 dark:hover:bg-neutral-900 border border-slate-100 dark:border-neutral-800 transition-colors text-left active:scale-[0.99]">
                                <div className="w-10 h-10 rounded-xl bg-[#25D366]/10 text-[#25D366] flex items-center justify-center shrink-0">
                                    <MessageCircle size={20} />
                                </div>
                                <span className="font-black text-slate-700 dark:text-slate-200 text-sm">WhatsApp</span>
                            </button>

                            <button onClick={() => { onOpenSizeCalc(); onClose(); }} className="w-full flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-neutral-950 hover:bg-slate-100 dark:hover:bg-neutral-900 border border-slate-100 dark:border-neutral-800 transition-colors text-left active:scale-[0.99]">

                            <div

                                className="w-full flex items-center justify-between p-3 rounded-2xl bg-slate-50 dark:bg-neutral-950 hover:bg-slate-100 dark:hover:bg-neutral-900 border border-slate-100 dark:border-neutral-800 transition-colors cursor-pointer"
