        ));

        const PaymentToggle = memo(({ mode, setMode }) => (
            <div className="w-full max-w-md sm:max-w-lg md:max-w-xl mx-auto mt-[70px] xs:mt-[74px] sm:mt-24 mb-3.5 xs:mb-4 sm:mb-6 px-2.5 xs:px-3.5 sm:px-5 relative z-30">
                <div className="flex flex-col items-center">
                    <span className="text-[9.5px] sm:text-[10px] font-black uppercase tracking-[0.22em] text-slate-700 dark:text-slate-300 mb-2 sm:mb-2.5">Opciones de Compra</span>
                    <div className="relative bg-white/85 dark:bg-black border border-white dark:border-neutral-800 p-1 sm:p-1.5 rounded-full flex w-full shadow-sm">
                        <div className={`gpu-layer absolute top-1 bottom-1 sm:top-1.5 sm:bottom-1.5 w-[calc(50%-4px)] sm:w-[calc(50%-6px)] bg-slate-900/5 dark:bg-neutral-900 border border-slate-200/70 dark:border-neutral-700 shadow-sm rounded-full transition-transform duration-200 ease-out ${mode === 'unidad' ? 'translate-x-0' : 'translate-x-full'}`} />
                        <button
                            className={`relative z-10 flex-1 py-2.5 sm:py-3 text-[11px] sm:text-xs md:text-[13px] font-black rounded-full flex items-center justify-center gap-1.5 sm:gap-2 whitespace-nowrap transition-colors ${mode === 'unidad' ? 'text-blue-700 dark:text-blue-400' : 'text-slate-600 dark:text-slate-400 hover:text-black dark:hover:text-white'}`}
                            onClick={() => setMode('unidad')}
                        >
                            <Tag size={15} /> Por Unidad
                        </button>
                        <button
                            className={`relative z-10 flex-1 py-2.5 sm:py-3 text-[11px] sm:text-xs md:text-[13px] font-black rounded-full flex items-center justify-center gap-1.5 sm:gap-2 whitespace-nowrap transition-colors ${mode === 'paquetes' ? 'text-blue-700 dark:text-blue-400' : 'text-slate-600 dark:text-slate-400 hover:text-black dark:hover:text-white'}`}
                            onClick={() => setMode('paquetes')}
                        >
                            <Layers size={15} /> Paquetes
                        </button>
                    </div>
                </div>
            </div>
        ));

        const ProductCard = memo(({ product, isPackage, onClick }) => (
            <div
                className="bg-white dark:bg-black border border-slate-200/70 dark:border-neutral-800 shadow-[0_6px_24px_rgba(15,23,42,0.06)] dark:shadow-[0_8px_28px_rgba(0,0,0,0.75)] rounded-[1.35rem] xs:rounded-[1.5rem] sm:rounded-[1.85rem] p-2 xs:p-2.5 sm:p-3 flex flex-col h-full group cursor-pointer hover:shadow-lg transition-transform duration-150 active:scale-[0.98] relative z-10"
                onClick={onClick}
            >
                <div className="w-full aspect-square rounded-[1.05rem] xs:rounded-[1.15rem] sm:rounded-[1.45rem] overflow-hidden bg-white dark:bg-neutral-950 mb-2 sm:mb-2.5 relative border border-slate-200/60 dark:border-neutral-800">
                    <img
                        src={product.image}
                        alt={product.title}
                        loading="lazy"
                        decoding="async"
                        className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                    />
                    {isPackage && product.savings && (
                        <div className="absolute top-2 right-2 sm:top-2.5 sm:right-2.5 bg-blue-600 text-white text-[9px] sm:text-[10px] font-black px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full z-10 shadow-sm">
                            -{product.savings}
                        </div>
                    )}
                </div>
                <div className="px-1 xs:px-1.5 pb-1 flex-1 flex flex-col justify-between">
                    <h3 className="text-xs xs:text-[13px] sm:text-sm md:text-[15px] font-black text-black dark:text-white leading-tight line-clamp-2">{product.title}</h3>
                    <div className="flex items-center justify-between mt-1 sm:mt-1.5">
                        <span className="text-xs xs:text-sm sm:text-base font-black text-blue-700 dark:text-blue-400">C${product.numericPrice.toFixed(2)}</span>
                    </div>
                </div>
            </div>
        ));

        // =========================================================================
        // APLICACIÓN PRINCIPAL
        // =========================================================================
        const App = () => {
            const [paymentMode, setPaymentMode] = useState('unidad');
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isSizeCalcOpen, setIsSizeCalcOpen] = useState(false);
            const [isOrdersOpen, setIsOrdersOpen] = useState(false);
            const [isProfileOpen, setIsProfileOpen] = useState(false);
            const [isSuggestionOpen, setIsSuggestionOpen] = useState(false);

            const [orders, setOrders] = useState(() => {
                try {
                    const saved = localStorage.getItem('diced_orders');
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });
            const [activeOrderId, setActiveOrderId] = useState(() => {
                try {
                    const saved = localStorage.getItem('diced_orders');
                    const parsed = saved ? JSON.parse(saved) : [];
                    return parsed.length > 0 ? parsed[0].id : null;
                } catch {
                    return null;
                }
            });

            useEffect(() => {
                localStorage.setItem('diced_orders', JSON.stringify(orders));
            }, [orders]);

            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('diced_dark_mode') === 'true');

            useEffect(() => {
                localStorage.setItem('diced_dark_mode', darkMode);
                document.documentElement.classList.toggle('dark', darkMode);
            }, [darkMode]);

            const hasOpenOverlay = Boolean(selectedProduct || isCartOpen || isMenuOpen || isSizeCalcOpen || isOrdersOpen || isProfileOpen || isSuggestionOpen);
            useEffect(() => {
                document.body.style.overflow = hasOpenOverlay ? 'hidden' : '';
                return () => { document.body.style.overflow = ''; };
            }, [hasOpenOverlay]);

            const [userProfile, setUserProfile] = useState(() => {
                try {
                    const savedProfile = localStorage.getItem('diced_profile');
                    const parsed = savedProfile ? JSON.parse(savedProfile) : { firstName: '', lastName: '', address: '', createdDay: '', userId: '' };
                    if (parsed && !parsed.userId && parsed.firstName && parsed.lastName && parsed.address) {
                        const day = parsed.createdDay || String(new Date().getDate()).padStart(2, '0');
                        parsed.createdDay = day;
                        parsed.userId = generateUserId(parsed.firstName, parsed.lastName, day);
                    }
                    return parsed;
                } catch {
                    return { firstName: '', lastName: '', address: '', createdDay: '', userId: '' };
                }
            });

            const userProfileRef = useRef(userProfile);
            useEffect(() => {
                userProfileRef.current = userProfile;
                localStorage.setItem('diced_profile', JSON.stringify(userProfile));
                if (userProfile?.userId) {
                    localStorage.setItem('diced_user_id', userProfile.userId);
                } else {
                    localStorage.removeItem('diced_user_id');
                }
            }, [userProfile]);

            const [cartItems, setCartItems] = useState(() => {
                try {
                    const savedCart = localStorage.getItem('diced_cart');
                    return savedCart ? JSON.parse(savedCart) : [];
                } catch {
                    return [];
                }
            });

            const [shipping, setShipping] = useState(() => {
                try {
                    const savedShipping = localStorage.getItem('diced_shipping');
                    return savedShipping ? JSON.parse(savedShipping) : null;
                } catch {
                    return null;
                }
            });

            const [activePromo, setActivePromo] = useState(() => {
                try {
                    const saved = localStorage.getItem('diced_promo_data');
                    if (saved) return JSON.parse(saved);
                    if (localStorage.getItem('diced_promo') === 'DICED') {
                        return { code: 'DICED', discount: 6 };
                    }
                    return null;
                } catch {
                    return null;
                }
            });

            useEffect(() => {
                if (activePromo) {
                    localStorage.setItem('diced_promo_data', JSON.stringify(activePromo));
                } else {
                    localStorage.removeItem('diced_promo_data');
                    localStorage.removeItem('diced_promo');
                }
            }, [activePromo]);

            useEffect(() => {
                localStorage.setItem('diced_cart', JSON.stringify(cartItems));
            }, [cartItems]);

            useEffect(() => {
                if (shipping) localStorage.setItem('diced_shipping', JSON.stringify(shipping));
                else localStorage.removeItem('diced_shipping');
            }, [shipping]);

            const handleAddToCart = useCallback((product, quantity, selectedColor, selectedSize) => {
                const targetColorName = selectedColor ? selectedColor.name : '';
                const targetColorHex = selectedColor ? selectedColor.hex : '';
                const targetSize = selectedSize || '';

                setCartItems(prevItems => {
                    const existingIdx = prevItems.findIndex(item =>
                        (item.productId || item.id) === product.id &&
                        (item.size || '') === targetSize &&
                        (item.colorName || '') === targetColorName
                    );

                    if (existingIdx !== -1) {
                        return prevItems.map((item, idx) =>
                            idx === existingIdx
                                ? { ...item, quantity: Math.min(12, item.quantity + quantity) }
                                : item
                        );
                    }

                    const newItem = {
                        ...product,
                        productId: product.id,
                        cartItemId: Math.random().toString(36).slice(2, 11),
                        quantity: Math.min(12, Math.max(1, quantity)),
                        colorName: targetColorName,
                        colorHex: targetColorHex,
                        size: targetSize
                    };
                    return [...prevItems, newItem];
                });
            }, []);

            const updateCartItemQuantity = useCallback((cartItemId, change) => {
                setCartItems(prev => prev.map(item => {
                    if (item.cartItemId === cartItemId) {
                        const newQty = item.quantity + change;
                        if (newQty > 12) return item;
                        return { ...item, quantity: Math.max(1, newQty) };
                    }
                    return item;
                }));
            }, []);

            const removeCartItem = useCallback((cartItemId) => {
                setCartItems(prev => prev.filter(item => item.cartItemId !== cartItemId));
            }, []);

            const handleCreateOrder = useCallback(({ customerName, customerAddress, shipping: orderShipping, activePromo: orderPromo, isPackageOrder, items }) => {
                const totals = calculateOrderTotals({
                    items,
                    shipping: orderShipping,
                    activePromo: orderPromo,
                    isPackageOrder
                });
                const now = new Date();
                const currentProfile = userProfileRef.current || {};
                let activeUserId = currentProfile.userId || '';
                if (!activeUserId) {
                    const fallbackParts = (customerName || '').trim().split(/\s+/);
                    const fName = currentProfile.firstName || fallbackParts[0] || '';
                    const lName = currentProfile.lastName || fallbackParts[1] || fallbackParts[0] || '';
                    const createdDay = currentProfile.createdDay || String(now.getDate()).padStart(2, '0');
                    activeUserId = generateUserId(fName, lName, createdDay);
                    setUserProfile(prev => ({
                        ...prev,
                        createdDay: prev?.createdDay || createdDay,
                        userId: activeUserId
                    }));
                }

                const orderId = 'ord_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                const dateStr = now.toLocaleString('es-NI', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
                const timeStr = now.toLocaleTimeString('es-NI', { hour: '2-digit', minute: '2-digit' });
                const fullAddress = customerAddress
                    ? (orderShipping && orderShipping.name ? `${orderShipping.name} — ${customerAddress}` : customerAddress)
                    : (orderShipping && orderShipping.name ? orderShipping.name : 'No especificada');

                const newOrder = {
                    id: orderId,
                    userId: activeUserId,
                    orderCode: activeUserId,
                    createdAt: dateStr,
                    customerName: customerName || 'Cliente DICED',
                    customerAddress: customerAddress || '',
                    fullAddress,
                    shipping: orderShipping || null,
                    activePromo: orderPromo || null,
                    isPackageOrder: Boolean(isPackageOrder),
                    items,
                    ...totals,
                    status: 'enviado',
                    chatStatus: 'abierto',
                    lastRemoteConversation: '',
                    lastDicedMessage: '',
                    messages: [
                        {
                            id: 'welcome_' + Date.now(),
                            sender: 'diced',
                            text: `¡Hola ${customerName || 'cliente'}! Recibimos tu pedido vinculado a tu ID #${activeUserId}. Escríbenos por este chat privado para validar tu pago o coordinar detalles sin usar WhatsApp.`,
                            time: timeStr
                        }
                    ]
                };

                sendOrderToGoogleSheets({
                    action: 'create_order',
                    fecha: dateStr,
                    userId: activeUserId,
                    orderId: orderId,
                    nombreCliente: newOrder.customerName,
                    codigoDescuento: orderPromo ? `${orderPromo.code} (-${orderPromo.discount}%)` : 'Ninguno',
                    direccionExacta: fullAddress,
                    totalPagar: Number(totals.total.toFixed(2)),
                    productosDetalle: formatExactProductDetails(items)
                });

                setOrders(prev => [newOrder, ...prev]);
                setActiveOrderId(newOrder.id);
                if (!isPackageOrder) {
                    setCartItems([]);
                    setIsCartOpen(false);
                }
                setIsOrdersOpen(true);
            }, []);

            const handleUpdateOrder = useCallback((orderId, updatedFields) => {
                setOrders(prev => prev.map(order => {
                    if (order.id !== orderId || order.status !== 'enviado') return order;
                    const updated = { ...order, ...updatedFields };
                    const linkedUserId = updated.userId || updated.orderCode || userProfileRef.current?.userId || '';
                    sendOrderToGoogleSheets({
                        action: 'update_order',
                        userId: linkedUserId,
                        orderId: updated.id,
                        totalPagar: Number(updated.total.toFixed(2)),
                        productosDetalle: formatExactProductDetails(updated.items)
                    });
                    return updated;
                }));
            }, []);

            const handleDeleteOrder = useCallback((orderId) => {
                setOrders(prev => {
                    const target = prev.find(o => o.id === orderId);
                    if (!target || target.status !== 'enviado') return prev;
                    const linkedUserId = target.userId || target.orderCode || userProfileRef.current?.userId || '';
                    sendOrderToGoogleSheets({
                        action: 'delete_order',
                        userId: linkedUserId,
                        orderId: target.id
                    });
                    const remaining = prev.filter(o => o.id !== orderId);
                    setActiveOrderId(curr => (curr === orderId ? (remaining[0]?.id || null) : curr));
                    return remaining;
                });
            }, []);

            const handleClearOrderHistory = useCallback(() => {
                setOrders([]);
                setActiveOrderId(null);
            }, []);

            const lastClientSendAtRef = useRef({});

            const handleSendOrderMessage = useCallback((orderId, text) => {
                const targetOrder = ordersRef.current.find(o => o.id === orderId);
                if (!targetOrder || targetOrder.chatStatus === 'cerrado') return;
                const linkedUserId = targetOrder.userId || targetOrder.orderCode || userProfileRef.current?.userId || '';
                if (!linkedUserId) return;

                const now = new Date();
                const timeStr = now.toLocaleTimeString('es-NI', { hour: '2-digit', minute: '2-digit' });
                const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                lastClientSendAtRef.current[orderId] = Date.now();

                sendOrderToGoogleSheets({
                    action: 'send_message',
                    userId: linkedUserId,
                    orderId: targetOrder.id,
                    remitente: 'CLIENTE',
                    mensaje: text
                });

                setOrders(prev => prev.map(order => {
                    if (order.id !== orderId || order.chatStatus === 'cerrado') return order;
                    return {
                        ...order,
                        lastRemoteConversation: `CLIENTE: ${text}`,
                        messages: [...(order.messages || []), { id: msgId, sender: 'cliente', text, time: timeStr }]
                    };
                }));
            }, []);

            const ordersRef = useRef(orders);
            useEffect(() => { ordersRef.current = orders; }, [orders]);

            const handleSyncOrder = useCallback(async (orderId, scope = 'all') => {
                const target = ordersRef.current.find(o => o.id === orderId);
                if (!target) return;
                const linkedUserId = target.userId || target.orderCode || userProfileRef.current?.userId || '';
                if (!linkedUserId) return;

                const result = await fetchOrderSyncFromGoogleSheets(linkedUserId, target.id, scope);
                if (!result || !result.ok) return;
                if (result.userId && String(result.userId) !== String(linkedUserId)) return;

                setOrders(prev => prev.map(order => {
                    if (order.id !== orderId) return order;
                    const nextStatus = result.status ? result.status : order.status;
                    const nextChatStatus = result.chatStatus ? result.chatStatus : (order.chatStatus || 'abierto');
                    let merged = order.messages || [];
                    let nextLastRemote = order.lastRemoteConversation || '';
                    let nextLastDiced = order.lastDicedMessage || '';

                    // Actualizar chat solo cuando corresponde (scope 'all' o 'chat') y no está cerrado
                    if ((scope === 'all' || scope === 'chat') && nextChatStatus !== 'cerrado') {
                        const remoteMessages = Array.isArray(result.messages) ? result.messages : null;
                        const remoteConv = (result.conversation || '').trim();
                        const latest = result.latestMessage || null;
                        const lastSendAt = lastClientSendAtRef.current[orderId] || 0;
                        const clientPostInFlight = (Date.now() - lastSendAt) < 3000;
                        const nowTime = new Date().toLocaleTimeString('es-NI', { hour: '2-digit', minute: '2-digit' });

                        if (remoteMessages && remoteMessages.length > 0) {
                            let updatedList = [...merged];
                            remoteMessages.forEach((rm) => {
                                if (!rm || !rm.text) return;
                                const rmSender = rm.sender === 'cliente' ? 'cliente' : 'diced';
                                const alreadyById = updatedList.some(m => m.id === rm.id || m.sheetId === rm.id);
                                if (alreadyById) return;

                                // Vincula mensajes previos sin sheetId si tienen el mismo remitente y exactamente el mismo texto
                                const legacyIdx = updatedList.findIndex(m =>
                                    m.sender === rmSender &&
                                    !String(m.id || '').startsWith('welcome_') &&
                                    !m.sheetId &&
                                    m.text === rm.text
                                );
                                if (legacyIdx !== -1) {
                                    updatedList[legacyIdx] = { ...updatedList[legacyIdx], sheetId: rm.id };
                                    return;
                                }

                                updatedList.push({
                                    id: rm.id,
                                    sheetId: rm.id,
                                    sender: rmSender,
                                    text: rm.text,
                                    time: nowTime
                                });
                            });
                            merged = updatedList;
                            if (remoteConv) {
                                nextLastRemote = remoteConv;
                                if (latest && latest.sender === 'diced') {
                                    nextLastDiced = remoteConv;
                                }
                            }
                        } else if (remoteConv && remoteConv !== nextLastRemote) {
                            if (latest && latest.text && latest.sender === 'diced') {
                                if (remoteConv !== nextLastDiced && !(clientPostInFlight && remoteConv === nextLastDiced)) {
                                    merged = [
                                        ...merged,
                                        {
                                            id: 'remote_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                                            sender: 'diced',
                                            text: latest.text,
                                            time: nowTime
                                        }
                                    ];
                                    nextLastDiced = remoteConv;
                                    nextLastRemote = remoteConv;
                                }
                            } else if (!clientPostInFlight) {
                                nextLastRemote = remoteConv;
                            }
                        }
                    }

                    return {
                        ...order,
                        userId: linkedUserId,
                        orderCode: linkedUserId,
                        status: nextStatus,
                        chatStatus: nextChatStatus,
                        lastRemoteConversation: nextLastRemote,
                        lastDicedMessage: nextLastDiced,
                        messages: merged
                    };
                }));
            }, []);

            const openCart = useCallback(() => setIsCartOpen(true), []);
            const openMenu = useCallback(() => setIsMenuOpen(true), []);
            const openProfile = useCallback(() => setIsProfileOpen(true), []);
            const openSizeCalcFromMenu = useCallback(() => {
                setIsOrdersOpen(false);
                setIsProfileOpen(false);
                setIsSuggestionOpen(false);
                setIsCartOpen(false);
                setSelectedProduct(null);
                setIsSizeCalcOpen(true);
            }, []);
            const openOrdersFromMenu = useCallback(() => {
                setIsProfileOpen(false);
                setIsSizeCalcOpen(false);
                setIsSuggestionOpen(false);
                setIsCartOpen(false);
                setSelectedProduct(null);
                setIsOrdersOpen(true);
            }, []);
            const openProfileFromMenu = useCallback(() => {
                setIsOrdersOpen(false);
                setIsSizeCalcOpen(false);
                setIsSuggestionOpen(false);
                setIsCartOpen(false);
                setSelectedProduct(null);
                setIsProfileOpen(true);
            }, []);
            const openSuggestionFromMenu = useCallback(() => {
                setIsOrdersOpen(false);
                setIsProfileOpen(false);
                setIsSizeCalcOpen(false);
                setIsCartOpen(false);
                setSelectedProduct(null);
                setIsSuggestionOpen(true);
            }, []);

            const totalCartItems = cartItems.reduce((acc, item) => acc + item.quantity, 0);

            return (
                <div className="min-h-screen flex flex-col safe-bottom">
                    <div className="relative z-10 w-full max-w-6xl mx-auto flex-1 flex flex-col pb-10">
                        <Header cartItemCount={totalCartItems} onOpenCart={openCart} onOpenMenu={openMenu} />
                        <PaymentToggle mode={paymentMode} setMode={setPaymentMode} />

                        <main className="flex-1 px-2.5 xs:px-3.5 sm:px-5 md:px-7 relative z-20">
                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5 xs:gap-3.5 sm:gap-4 md:gap-5">
                                {paymentMode === 'unidad'
                                    ? PRODUCTS_DATA.map(p => (
                                        <ProductCard key={p.id} product={p} isPackage={false} onClick={() => setSelectedProduct(p)} />
                                    ))
                                    : PACKAGES_DATA.map(p => (
                                        <ProductCard key={p.id} product={p} isPackage={true} onClick={() => setSelectedProduct(p)} />
                                    ))
                                }
                            </div>
                        </main>
                    </div>

                    {selectedProduct && (
                        <ProductModal
                            key={selectedProduct.id}
                            product={selectedProduct}
                            mode={paymentMode}
                            userProfile={userProfile}
                            shipping={shipping}
                            onClose={() => setSelectedProduct(null)}
                            onAddToCart={handleAddToCart}
                            onCreateOrder={handleCreateOrder}
                            onOpenProfile={openProfile}
                        />
                    )}

                    {isCartOpen && (
                        <CartModal
                            cartItems={cartItems}
                            shipping={shipping}
                            userProfile={userProfile}
                            activePromo={activePromo}
                            setActivePromo={setActivePromo}
                            onClose={() => setIsCartOpen(false)}
                            updateQuantity={updateCartItemQuantity}
                            removeItem={removeCartItem}
                            onOpenProfile={openProfile}
                            onCreateOrder={handleCreateOrder}
                        />
                    )}

                    <SideMenu
                        isOpen={isMenuOpen}
                        onClose={() => setIsMenuOpen(false)}
                        onOpenSizeCalc={openSizeCalcFromMenu}
                        onOpenOrders={openOrdersFromMenu}
                        onOpenProfile={openProfileFromMenu}
                        onOpenSuggestion={openSuggestionFromMenu}
                        userProfile={userProfile}
                        ordersCount={orders.length}
                        darkMode={darkMode}
                        setDarkMode={setDarkMode}
                    />
                    <SizeCalculator isOpen={isSizeCalcOpen} onClose={() => setIsSizeCalcOpen(false)} onOpenMenu={openMenu} />
                    <SuggestionModal
                        isOpen={isSuggestionOpen}
                        onClose={() => setIsSuggestionOpen(false)}
                        onOpenMenu={openMenu}
                        userProfile={userProfile}
                    />
                    <OrdersModal
                        isOpen={isOrdersOpen}
                        onClose={() => setIsOrdersOpen(false)}
                        onOpenMenu={openMenu}
                        orders={orders}
                        activeOrderId={activeOrderId}
                        setActiveOrderId={setActiveOrderId}
                        onUpdateOrder={handleUpdateOrder}
                        onDeleteOrder={handleDeleteOrder}
                        onClearHistory={handleClearOrderHistory}
                        onSendMessage={handleSendOrderMessage}
                        onSyncOrder={handleSyncOrder}
                    />
                    <ProfileModal
                        isOpen={isProfileOpen}
                        onClose={() => setIsProfileOpen(false)}
                        onOpenMenu={openMenu}
                        userProfile={userProfile}
                        setUserProfile={setUserProfile}
                        shipping={shipping}
                        setShipping={setShipping}
                        activePromo={activePromo}
                        setActivePromo={setActivePromo}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
