                                    <span className="font-black text-slate-700 dark:text-slate-200 text-sm">Modo Oscuro</span>
                                </div>
                                <div className={`w-11 h-6 rounded-full p-0.5 transition-colors duration-200 flex items-center ${darkMode ? 'bg-blue-600 justify-end' : 'bg-slate-300 justify-start'}`}>
                                    <div className="w-5 h-5 rounded-full bg-white shadow-sm" />
                                </div>
                            </div>
                        </div>

                        <div className="p-4 border-t border-slate-200/60 dark:border-neutral-800">
                            <p className="text-[10px] text-center font-bold text-slate-400 dark:text-slate-500">© 2023 DICED SPORTS</p>
                        </div>
                    </div>
                </div>
            );
        });

        const Header = memo(({ cartItemCount, onOpenCart, onOpenMenu }) => (
            <header className="fixed top-0 left-0 right-0 z-40 px-3 sm:px-5 pt-2.5 sm:pt-3.5 pb-2">
                <SurfaceCard blur={true} className="rounded-full px-3 sm:px-4 py-2 sm:py-2.5 flex items-center justify-between max-w-5xl mx-auto">
                    <div className="flex items-center gap-2.5 sm:gap-3">
                        <button onClick={onOpenMenu} aria-label="Abrir menú" className="p-2 sm:p-2.5 bg-white/90 dark:bg-neutral-900 hover:bg-white dark:hover:bg-neutral-800 rounded-full transition-colors shadow-sm active:scale-95">
                            <Menu size={20} className="text-black dark:text-white" />
                        </button>
                        <div className="flex flex-col">
                            <h1 className="text-lg sm:text-xl font-black tracking-tighter text-black dark:text-white leading-none">DICED</h1>
                            <span className="text-[8.5px] sm:text-[9px] font-bold tracking-widest text-slate-600 dark:text-slate-400 mt-0.5">EST. 2023</span>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <button onClick={onOpenCart} aria-label="Abrir carrito" className="p-2 sm:p-2.5 relative bg-white/90 dark:bg-neutral-900 hover:bg-white dark:hover:bg-neutral-800 rounded-full transition-colors shadow-sm active:scale-95">
                            <ShoppingCart size={20} className="text-black dark:text-white sm:w-[22px] sm:h-[22px]" />
                            {cartItemCount > 0 && (
                                <span className="absolute -top-1 -right-1 h-5 min-w-[20px] px-1 bg-blue-600 rounded-full text-[10px] text-white flex items-center justify-center font-black shadow-sm border-2 border-[#f4f6fa] dark:border-black">
                                    {cartItemCount}
                                </span>
                            )}
                        </button>
                    </div>
                </SurfaceCard>
            </header>
        ));

        const PaymentToggle = memo(({ mode, setMode }) => (
            <div className="w-full max-w-md sm:max-w-lg mx-auto mt-[74px] sm:mt-24 mb-4 sm:mb-6 px-3 sm:px-5 relative z-30">
                <div className="flex flex-col items-center">
                    <span className="text-[9.5px] sm:text-[10px] font-black uppercase tracking-[0.22em] text-slate-700 dark:text-slate-300 mb-2 sm:mb-2.5">Opciones de Compra</span>
                    <div className="relative bg-white/85 dark:bg-black border border-white dark:border-neutral-800 p-1 sm:p-1.5 rounded-full flex w-full shadow-sm">
                        <div className={`gpu-layer absolute top-1 bottom-1 sm:top-1.5 sm:bottom-1.5 w-[calc(50%-4px)] sm:w-[calc(50%-6px)] bg-slate-900/5 dark:bg-neutral-900 border border-slate-200/70 dark:border-neutral-700 shadow-sm rounded-full transition-transform duration-200 ease-out ${mode === 'unidad' ? 'translate-x-0' : 'translate-x-full'}`} />
                        <button
                            className={`relative z-10 flex-1 py-2.5 sm:py-3 text-[11px] sm:text-xs font-black rounded-full flex items-center justify-center gap-1.5 sm:gap-2 whitespace-nowrap transition-colors ${mode === 'unidad' ? 'text-blue-700 dark:text-blue-400' : 'text-slate-600 dark:text-slate-400 hover:text-black dark:hover:text-white'}`}
                            onClick={() => setMode('unidad')}
                        >
                            <Tag size={15} /> Por Unidad
                        </button>
                        <button
                            className={`relative z-10 flex-1 py-2.5 sm:py-3 text-[11px] sm:text-xs font-black rounded-full flex items-center justify-center gap-1.5 sm:gap-2 whitespace-nowrap transition-colors ${mode === 'paquetes' ? 'text-blue-700 dark:text-blue-400' : 'text-slate-600 dark:text-slate-400 hover:text-black dark:hover:text-white'}`}
                            onClick={() => setMode('paquetes')}
                        >
                            <Layers size={15} /> Paquetes
                        </button>
                    </div>
                </div>
            </div>
        ));

        const ProductCard = memo(({ product, isPackage, onClick }) => (
            <div
                className="bg-white dark:bg-black border border-slate-200/70 dark:border-neutral-800 shadow-[0_6px_24px_rgba(15,23,42,0.06)] dark:shadow-[0_8px_28px_rgba(0,0,0,0.75)] rounded-[1.5rem] sm:rounded-[1.85rem] p-2 sm:p-2.5 flex flex-col h-full group cursor-pointer hover:shadow-lg transition-transform duration-150 active:scale-[0.98] relative z-10"
                onClick={onClick}
            >
                <div className="w-full aspect-square rounded-[1.15rem] sm:rounded-[1.45rem] overflow-hidden bg-white dark:bg-neutral-950 mb-2 sm:mb-2.5 relative border border-slate-200/60 dark:border-neutral-800">
                    <img
                        src={product.image}
                        alt={product.title}
                        loading="lazy"
                        decoding="async"
                        className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                    />
                    {isPackage && product.savings && (
                        <div className="absolute top-2 right-2 sm:top-2.5 sm:right-2.5 bg-blue-600 text-white text-[9px] font-black px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full z-10 shadow-sm">
                            -{product.savings}
                        </div>
                    )}
                </div>
                <div className="px-1.5 pb-1 flex-1 flex flex-col justify-between">
                    <h3 className="text-xs xs:text-[13px] sm:text-sm font-black text-black dark:text-white leading-tight line-clamp-2">{product.title}</h3>
                    <div className="flex items-center justify-between mt-1 sm:mt-1.5">
                        <span className="text-xs xs:text-sm sm:text-base font-black text-blue-700 dark:text-blue-400">C${product.numericPrice.toFixed(2)}</span>
                    </div>
                </div>
            </div>
        ));

        // =========================================================================
        // APLICACIÓN PRINCIPAL
        // =========================================================================
        const App = () => {
            const [paymentMode, setPaymentMode] = useState('unidad');
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isSizeCalcOpen, setIsSizeCalcOpen] = useState(false);
            const [isOrdersOpen, setIsOrdersOpen] = useState(false);
            const [isProfileOpen, setIsProfileOpen] = useState(false);

            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('diced_dark_mode') === 'true');

            useEffect(() => {
                localStorage.setItem('diced_dark_mode', darkMode);
                document.documentElement.classList.toggle('dark', darkMode);
            }, [darkMode]);

            const hasOpenOverlay = Boolean(selectedProduct || isCartOpen || isMenuOpen || isSizeCalcOpen || isOrdersOpen || isProfileOpen);
            useEffect(() => {
                document.body.style.overflow = hasOpenOverlay ? 'hidden' : '';
                return () => { document.body.style.overflow = ''; };
            }, [hasOpenOverlay]);

            const [userProfile, setUserProfile] = useState(() => {
                try {
                    const savedProfile = localStorage.getItem('diced_profile');
                    return savedProfile ? JSON.parse(savedProfile) : { firstName: '', lastName: '', address: '' };
                } catch {
                    return { firstName: '', lastName: '', address: '' };
                }
            });

            useEffect(() => {
                localStorage.setItem('diced_profile', JSON.stringify(userProfile));
            }, [userProfile]);

            const [cartItems, setCartItems] = useState(() => {
                try {
                    const savedCart = localStorage.getItem('diced_cart');
                    return savedCart ? JSON.parse(savedCart) : [];
                } catch {
                    return [];
                }
            });

            const [shipping, setShipping] = useState(() => {
                try {
                    const savedShipping = localStorage.getItem('diced_shipping');
                    return savedShipping ? JSON.parse(savedShipping) : null;
                } catch {
                    return null;
                }
            });

            const [activePromo, setActivePromo] = useState(() => {
                try {
                    const saved = localStorage.getItem('diced_promo_data');
                    if (saved) return JSON.parse(saved);
                    if (localStorage.getItem('diced_promo') === 'DICED') {
                        return { code: 'DICED', discount: 6 };
                    }
                    return null;
                } catch {
                    return null;
                }
            });

            useEffect(() => {
                if (activePromo) {
                    localStorage.setItem('diced_promo_data', JSON.stringify(activePromo));
                } else {
                    localStorage.removeItem('diced_promo_data');
                    localStorage.removeItem('diced_promo');
                }
            }, [activePromo]);

            useEffect(() => {
                localStorage.setItem('diced_cart', JSON.stringify(cartItems));
            }, [cartItems]);

            useEffect(() => {
                if (shipping) localStorage.setItem('diced_shipping', JSON.stringify(shipping));
                else localStorage.removeItem('diced_shipping');
            }, [shipping]);

            const handleAddToCart = useCallback((product, quantity, selectedColor, selectedSize) => {
                const newItem = {
                    ...product,
                    cartItemId: Math.random().toString(36).substr(2, 9),
                    quantity,
                    colorName: selectedColor ? selectedColor.name : '',
                    colorHex: selectedColor ? selectedColor.hex : '',
                    size: selectedSize || ''
                };
                setCartItems(prevItems => [...prevItems, newItem]);
            }, []);

            const updateCartItemQuantity = useCallback((cartItemId, change) => {
                setCartItems(prev => prev.map(item => {
                    if (item.cartItemId === cartItemId) {
                        const newQty = item.quantity + change;
                        if (newQty > 12) return item;
                        return { ...item, quantity: Math.max(1, newQty) };
                    }
                    return item;
                }));
            }, []);

            const removeCartItem = useCallback((cartItemId) => {
                setCartItems(prev => prev.filter(item => item.cartItemId !== cartItemId));
            }, []);

            const openCart = useCallback(() => setIsCartOpen(true), []);
            const openMenu = useCallback(() => setIsMenuOpen(true), []);
            const openSizeCalc = useCallback(() => setIsSizeCalcOpen(true), []);
            const openOrders = useCallback(() => setIsOrdersOpen(true), []);
            const openProfile = useCallback(() => setIsProfileOpen(true), []);

            const totalCartItems = cartItems.reduce((acc, item) => acc + item.quantity, 0);

            return (
                <div className="min-h-screen flex flex-col">
                    <div className="relative z-10 w-full max-w-5xl mx-auto flex-1 flex flex-col pb-10">
                        <Header cartItemCount={totalCartItems} onOpenCart={openCart} onOpenMenu={openMenu} />
                        <PaymentToggle mode={paymentMode} setMode={setPaymentMode} />

                        <main className="flex-1 px-3 sm:px-5 relative z-20">
                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5 xs:gap-3 sm:gap-4 md:gap-5">
                                {paymentMode === 'unidad'
                                    ? PRODUCTS_DATA.map(p => (
                                        <ProductCard key={p.id} product={p} isPackage={false} onClick={() => setSelectedProduct(p)} />
                                    ))
                                    : PACKAGES_DATA.map(p => (
                                        <ProductCard key={p.id} product={p} isPackage={true} onClick={() => setSelectedProduct(p)} />
                                    ))
                                }
                            </div>
                        </main>
                    </div>

                    {selectedProduct && (
                        <ProductModal
                            key={selectedProduct.id}
                            product={selectedProduct}
                            mode={paymentMode}
                            userProfile={userProfile}
                            shipping={shipping}
                            onClose={() => setSelectedProduct(null)}
                            onAddToCart={handleAddToCart}
                            onOpenProfile={openProfile}
                        />
                    )}

                    {isCartOpen && (
                        <CartModal
                            cartItems={cartItems}
                            shipping={shipping}
                            userProfile={userProfile}
                            activePromo={activePromo}
                            setActivePromo={setActivePromo}
                            onClose={() => setIsCartOpen(false)}
                            updateQuantity={updateCartItemQuantity}
                            removeItem={removeCartItem}
                            onOpenProfile={openProfile}
                        />
                    )}

                    <SideMenu
                        isOpen={isMenuOpen}
                        onClose={() => setIsMenuOpen(false)}
                        onOpenSizeCalc={openSizeCalc}
                        onOpenOrders={openOrders}
                        onOpenProfile={openProfile}
                        userProfile={userProfile}
                        darkMode={darkMode}
                        setDarkMode={setDarkMode}
                    />
                    <SizeCalculator isOpen={isSizeCalcOpen} onClose={() => setIsSizeCalcOpen(false)} />
                    <OrdersModal isOpen={isOrdersOpen} onClose={() => setIsOrdersOpen(false)} />
                    <ProfileModal
                        isOpen={isProfileOpen}
                        onClose={() => setIsProfileOpen(false)}
                        userProfile={userProfile}
                        setUserProfile={setUserProfile}
                        shipping={shipping}
                        setShipping={setShipping}
                        activePromo={activePromo}
                        setActivePromo={setActivePromo}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
