    <script>
        // Generador dinámico de íconos, manifiesto PWA y Service Worker en segundo plano
        (function setupPWA() {
            const createAppIcon = (size) => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                const grad = ctx.createLinearGradient(0, 0, size, size);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(1, '#090d16');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(0, 0, size, size, size * 0.22);
                ctx.fill();

                ctx.fillStyle = 'rgba(37, 99, 235, 0.25)';
                ctx.beginPath();
                ctx.arc(size * 0.8, size * 0.2, size * 0.35, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = `900 ${size * 0.26}px system-ui, -apple-system, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('DICED', size / 2, size * 0.46);

                ctx.fillStyle = '#3b82f6';
                ctx.font = `800 ${size * 0.075}px system-ui, -apple-system, sans-serif`;
                ctx.fillText('EST. 2023', size / 2, size * 0.66);

                return canvas.toDataURL('image/png');
            };

            const initPWA = () => {
                try {
                    const icon192 = createAppIcon(192);
                    const icon512 = createAppIcon(512);

                    const appleIcon = document.createElement('link');
                    appleIcon.rel = 'apple-touch-icon';
                    appleIcon.href = icon192;
                    document.head.appendChild(appleIcon);

                    const favIcon = document.createElement('link');
                    favIcon.rel = 'icon';
                    favIcon.type = 'image/png';
                    favIcon.href = icon192;
                    document.head.appendChild(favIcon);

                    const manifest = {
                        name: 'DICED Sports Store',
                        short_name: 'DICED',
                        description: 'Tienda oficial de ropa deportiva DICED. EST. 2023.',
                        start_url: window.location.href,
                        display: 'standalone',
                        orientation: 'any',
                        background_color: '#000000',
                        theme_color: '#000000',
                        icons: [
                            { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                        ]
                    };

                    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
                    const manifestURL = URL.createObjectURL(manifestBlob);
                    const manifestLink = document.createElement('link');
                    manifestLink.rel = 'manifest';
                    manifestLink.href = manifestURL;
                    document.head.appendChild(manifestLink);

                    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
                        const swCode = `
                            const CACHE_NAME = 'diced-pwa-v1';
                            self.addEventListener('install', () => self.skipWaiting());
                            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                            self.addEventListener('fetch', (e) => {
                                e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                            });
                        `;
                        const swBlob = new Blob([swCode], { type: 'application/javascript' });
                        const swUrl = URL.createObjectURL(swBlob);
                        navigator.serviceWorker.register(swUrl).catch(() => {});
                    }
                } catch (err) {
                    console.warn('PWA setup notice:', err);
                }
            };

            window.addEventListener('DOMContentLoaded', () => {
                if ('requestIdleCallback' in window) {
                    requestIdleCallback(initPWA);
                } else {
                    setTimeout(initPWA, 150);
                }
            });
        })();
    </script>

        const validateCouponInGoogleSheets = (rawCode) => {
            const code = (rawCode || '').trim().toUpperCase();
            if (!code) {
                return Promise.resolve({ valid: false, message: 'Ingresa un código de descuento.' });
            }

            // Respaldo local si no hay URL configurada
            if (!COUPONS_SCRIPT_URL || COUPONS_SCRIPT_URL === "PEGA_AQUI_TU_URL_DE_CUPONES") {
                if (code === 'DICED') {
                    return Promise.resolve({ valid: true, code: 'DICED', discount: 6 });
                }
                return Promise.resolve({ valid: false, message: 'Código no válido o no disponible.' });
            }

            // JSONP: funciona tanto en archivo local (file:///) como en web HTTPS sin bloqueos CORS
            return new Promise((resolve) => {
                const callbackName = '__dicedCouponCb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
                const script = document.createElement('script');
                let settled = false;

                const cleanup = () => {
                    try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
                    if (script.parentNode) script.parentNode.removeChild(script);
                };

                const timer = setTimeout(() => {
                    if (!settled) {
                        settled = true;
                        cleanup();
                        resolve({ valid: false, message: 'Tiempo de espera agotado. Revisa tu conexión.' });
                    }
                }, 10000);

                window[callbackName] = (data) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    cleanup();

                    if (data && data.valid) {
                        const discountNum = Number(data.discount);
                        resolve({
                            valid: true,
                            code: (data.code || code).toUpperCase(),
                            discount: discountNum > 0 && discountNum <= 100 ? discountNum : 6
                        });
                    } else {
                        resolve({
                            valid: false,
                            message: (data && data.message) ? data.message : 'Código no válido o no disponible.'
                        });
                    }
                };

                script.onerror = () => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    cleanup();
                    resolve({ valid: false, message: 'No se pudo verificar el código. Revisa tu conexión.' });
                };

                const sep = COUPONS_SCRIPT_URL.includes('?') ? '&' : '?';
                script.src = `${COUPONS_SCRIPT_URL}${sep}code=${encodeURIComponent(code)}&callback=${encodeURIComponent(callbackName)}&_t=${Date.now()}`;
                document.body.appendChild(script);
            });
        };

        // =========================================================================

        const generateAndSendOrderJPG = ({
            customerName,
            customerAddress,
            shippingLocation,
            items,
            subtotal,

            promoDiscountAmount,

            totalWeightKg,

        }) => {
            const now = new Date();
            const orderId = generateOrderCode(total);

            const dateStr = now.toLocaleString('es-NI', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });

            const fullAddress = customerAddress
                ? (shippingLocation ? `${shippingLocation} — ${customerAddress}` : customerAddress)
                : (shippingLocation || 'No especificada');

            const detalleResumen = items.map(it => `${it.quantity}x ${it.title}${it.description ? ` (${it.description})` : ''}`).join(' | ');
            sendOrderToGoogleSheets({
                fecha: dateStr,
                codigoPedido: orderId,
                nombreCliente: customerName || 'Cliente DICED',
                codigoDescuento: activePromo ? `${activePromo.code} (-${activePromo.discount}%)` : 'Ninguno',
                direccionExacta: fullAddress,
                totalPagar: Number(total.toFixed(2)),
                detallePedido: detalleResumen,
                metodoPago: 'WhatsApp (JPG)'
            });

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const width = 800;

            const wrapText = (context, text, maxWidth, font) => {
                context.font = font;
                const words = (text || '').split(' ');
                const lines = [];
                let currentLine = words[0] || '';

                for (let i = 1; i < words.length; i++) {
                    const word = words[i];
                    const testLine = currentLine + ' ' + word;
                    if (context.measureText(testLine).width < maxWidth) {
                        currentLine = testLine;
                    } else {
                        lines.push(currentLine);
                        currentLine = word;
                    }
                }
                lines.push(currentLine);
                return lines;
            };

            const addressLines = wrapText(ctx, fullAddress, 620, 'bold 20px system-ui, -apple-system, sans-serif');

            const preparedItems = items.map(item => {
                const descLines = wrapText(ctx, item.description || '', 480, '600 18px system-ui, -apple-system, sans-serif');
                const rowHeight = Math.max(85, 52 + descLines.length * 24);
                return { ...item, descLines, rowHeight };
            });

            const itemsTotalHeight = preparedItems.reduce((acc, it) => acc + it.rowHeight + 16, 0);
            let summaryLinesCount = 1;
            if (volumeDiscountAmount > 0) summaryLinesCount++;
            if (activePromo) summaryLinesCount++;

            const containerRef = useRef(null);
            const [tempValue, setTempValue] = useState(selectedValue);
            const scrollTimeout = useRef(null);

            useEffect(() => {
                if (isOpen) {
                    setTempValue(selectedValue);
                    requestAnimationFrame(() => {
                        if (containerRef.current) {
                            const index = items.indexOf(selectedValue);
                            if (index >= 0) containerRef.current.scrollTop = index * 40;
                        }
                    });
                }
            }, [isOpen]);

            useEffect(() => {
                return () => {
                    if (scrollTimeout.current) clearTimeout(scrollTimeout.current);
                };
            }, []);

            const handleScroll = () => {
                if (!containerRef.current) return;
                const index = Math.min(items.length - 1, Math.max(0, Math.round(containerRef.current.scrollTop / 40)));
                if (items[index] !== undefined && items[index] !== tempValue) {
                    setTempValue(items[index]);
                }
                if (scrollTimeout.current) clearTimeout(scrollTimeout.current);
                scrollTimeout.current = setTimeout(() => {
                    if (containerRef.current) {
                        const finalIndex = Math.min(items.length - 1, Math.max(0, Math.round(containerRef.current.scrollTop / 40)));
                        if (items[finalIndex] !== undefined) {
                            setTempValue(items[finalIndex]);
                            onSelect(items[finalIndex]);
                        }
                    }
                }, 100);
            };

            if (!isOpen) return null;

            return (
                <>
                    <div className="fixed inset-0 z-40" onClick={onClose} />
                    <div className={`absolute ${openUp ? 'bottom-full mb-1.5' : 'top-full mt-1.5'} left-0 right-0 z-50 bg-white dark:bg-neutral-950 border border-slate-200 dark:border-neutral-800 rounded-2xl shadow-xl overflow-hidden`}>
