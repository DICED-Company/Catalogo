<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DICED</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { margin: 0; padding: 0; background-color: #f4f6fa; overflow-x: hidden; transition: background-color 0.3s ease; }
        html.dark body { background-color: #090d16; }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #2563eb;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: transform 0.15s ease, border-width 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.15);
            border-width: 4px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: transparent;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const Icon = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const ShoppingCart = (p) => <Icon {...p}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></Icon>;
        const MessageCircle = (p) => <Icon {...p}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></Icon>;
        const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
        const ChevronRight = (p) => <Icon {...p}><path d="m9 18 6-6-6-6"/></Icon>;
        const ChevronLeft = (p) => <Icon {...p}><path d="m15 18-6-6 6-6"/></Icon>;
        const Plus = (p) => <Icon {...p}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
        const Minus = (p) => <Icon {...p}><path d="M5 12h14"/></Icon>;
        const Trash2 = (p) => <Icon {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>;
        const Check = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5"/></Icon>;
        const ChevronDown = (p) => <Icon {...p}><path d="m6 9 6 6 6-6"/></Icon>;
        const Tag = (p) => <Icon {...p}><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></Icon>;
        const Layers = (p) => <Icon {...p}><path d="m12.83 2.18a1.5 1.5 0 0 0-1.66 0L2.6 6.08a1.2 1.2 0 0 0 0 2.15l8.57 3.9a1.5 1.5 0 0 0 1.66 0l8.57-3.9a1.2 1.2 0 0 0 0-2.15Z"/><path d="M2.2 10.81l8.97 4.08a1.5 1.5 0 0 0 1.66 0l8.97-4.08"/><path d="M2.2 15.5l8.97 4.08a1.5 1.5 0 0 0 1.66 0l8.97-4.08"/></Icon>;
        const CreditCard = (p) => <Icon {...p}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></Icon>;
        const Menu = (p) => <Icon {...p}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></Icon>;
        const Ruler = (p) => <Icon {...p}><rect x="2" y="9" width="20" height="6" rx="2" ry="2" /><line x1="6" y1="9" x2="6" y2="12" /><line x1="10" y1="9" x2="10" y2="15" /><line x1="14" y1="9" x2="14" y2="12" /><line x1="18" y1="9" x2="18" y2="15" /></Icon>;
        const Truck = (p) => <Icon {...p}><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h2"/><path d="M14 17h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></Icon>;
        const MapPin = (p) => <Icon {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></Icon>;
        const Moon = (p) => <Icon {...p}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></Icon>;
        const Sun = (p) => <Icon {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></Icon>;
        const Sparkles = (p) => <Icon {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></Icon>;
        const User = (p) => <Icon {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;

        const GlassContainer = ({ children, className = '', onClick }) => (
            <div onClick={onClick} className={`bg-white/50 dark:bg-slate-900/65 backdrop-blur-xl border border-white/60 dark:border-slate-700/60 shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] dark:shadow-[0_8px_32px_0_rgba(0,0,0,0.45)] transition-colors duration-300 ${className}`}>
                {children}
            </div>
        );

        const WheelPicker = ({ items, selectedValue, onSelect, isOpen, onClose }) => {
            const containerRef = useRef(null);
            const [tempValue, setTempValue] = useState(selectedValue);
            const scrollTimeout = useRef(null);

            useEffect(() => {
                if (isOpen) {
                    setTempValue(selectedValue);
                    setTimeout(() => {
                        if (containerRef.current) {
                            const index = items.indexOf(selectedValue);
                            containerRef.current.scrollTop = index * 40;
                        }
                    }, 10);
                }
            }, [isOpen, selectedValue, items]);

            const handleScroll = () => {
                if (scrollTimeout.current) clearTimeout(scrollTimeout.current);
                scrollTimeout.current = setTimeout(() => {
                    if (containerRef.current) {
                        const index = Math.round(containerRef.current.scrollTop / 40);
                        if (items[index] !== undefined) {
                            setTempValue(items[index]);
                            onSelect(items[index]);
                        }
                    }
                }, 150);
            };

            if (!isOpen) return null;

            return (
                <>
                <div className="fixed inset-0 z-40" onClick={onClose} />
                <div className="absolute top-1/2 left-0 right-0 -translate-y-1/2 bg-white/95 dark:bg-slate-800/95 backdrop-blur-2xl border border-white/90 dark:border-slate-700 rounded-[1.25rem] shadow-[0_10px_40px_rgba(0,0,0,0.25)] z-50 overflow-hidden animate-in zoom-in-95 duration-200">
                    <div className="absolute top-0 left-0 right-0 h-[30px] bg-gradient-to-b from-white dark:from-slate-800 to-transparent pointer-events-none z-30"></div>
                    <div className="absolute bottom-0 left-0 right-0 h-[30px] bg-gradient-to-t from-white dark:from-slate-800 to-transparent pointer-events-none z-30"></div>
                    
                    <div className="absolute top-1/2 left-2 right-2 h-[40px] -translate-y-1/2 bg-slate-100/70 dark:bg-slate-700/60 rounded-xl pointer-events-none border border-slate-200/80 dark:border-slate-600 z-20 shadow-inner"></div>

                    <div 
                    ref={containerRef}
                    className="relative h-[120px] overflow-y-auto snap-y snap-mandatory hide-scrollbar z-10"
                    onScroll={handleScroll}
                    >
                        <div className="h-[40px]"></div> 
                        {items.map((item) => (
                        <div 
                            key={item}
                            onClick={() => { onSelect(item); onClose(); }}
                            className={`h-[40px] flex items-center justify-center snap-center cursor-pointer transition-all duration-300 ${
                            tempValue === item 
                                ? 'text-lg font-black text-black dark:text-white scale-110' 
                                : 'text-sm font-bold text-slate-400 dark:text-slate-500 opacity-60'
                            }`}
                        >
                            {item}
                        </div>
                        ))}
                        <div className="h-[40px]"></div>
                    </div>
                </div>
                </>
            );
        };

        const SizeCalculator = ({ isOpen, onClose }) => {
            const [weight, setWeight] = useState(155);
            const [height, setHeight] = useState(1.76);

            if (!isOpen) return null;

            const minWeight = height >= 1.80 ? 145 : 100;

            const handleHeightChange = (e) => {
                const newHeight = parseFloat(e.target.value);
                setHeight(newHeight);
                if (newHeight >= 1.80 && weight < 145) {
                    setWeight(145);
                }
            };

            const getRecommendedSize = (w, h) => {
                const sizes = ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL', '4XL'];
                let baseIndex = 0;
                if (w <= 120) baseIndex = 0;
                else if (w <= 140) baseIndex = 1;
                else if (w <= 170) baseIndex = 2;
                else if (w <= 195) baseIndex = 3;
                else if (w <= 220) baseIndex = 4;
                else if (w <= 240) baseIndex = 5;
                else if (w <= 265) baseIndex = 6;
                else baseIndex = 7;

                let adjustment = 0;
                if (h <= 1.75) adjustment = -1;
                else if (h >= 1.87) adjustment = 1;

                const finalIndex = Math.max(0, Math.min(sizes.length - 1, baseIndex + adjustment));
                return sizes[finalIndex];
            };

            const currentSize = getRecommendedSize(weight, height);
            const weightPercentage = ((weight - minWeight) / (300 - minWeight)) * 100;
            const heightPercentage = ((height - 1.68) / (1.90 - 1.68)) * 100;

            return (
                <div className="fixed inset-0 z-[130] flex items-end justify-center bg-black/50 backdrop-blur-sm transition-opacity p-0 sm:p-4">
                    <div className="absolute inset-0" onClick={onClose}></div>
                    
                    <div className="w-full sm:max-w-md bg-white dark:bg-slate-900 border-t dark:border border-transparent dark:border-slate-800 rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 relative flex flex-col shadow-2xl animate-in slide-in-from-bottom-full duration-300 z-10">
                        <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-5"></div>
                        
                        <div className="flex items-center justify-center gap-2 mb-1">
                            <Ruler size={22} className="text-blue-600 dark:text-blue-400" />
                            <h2 className="text-xl font-black text-black dark:text-white tracking-tight text-center">Calculador de Talla</h2>
                        </div>
                        <p className="text-xs text-slate-500 dark:text-slate-400 text-center mb-5 font-medium">Desliza para ajustar tu peso y estatura.</p>

                        <div className="bg-slate-50 dark:bg-slate-800/80 border border-slate-100 dark:border-slate-700/70 rounded-[2rem] p-5 mb-6 flex flex-col items-center justify-center shadow-inner">
                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-1">Tu talla ideal es</span>
                            <span className="text-5xl font-black text-blue-600 dark:text-blue-400 tracking-tighter my-1">{currentSize}</span>
                            <div className="flex items-center gap-2 mt-1 bg-white dark:bg-slate-900 px-3 py-1 rounded-full border border-slate-200/60 dark:border-slate-700 shadow-sm">
                                <span className="text-xs font-black text-slate-700 dark:text-slate-200">{weight} lb</span>
                                <span className="text-slate-300 dark:text-slate-600">•</span>
                                <span className="text-xs font-black text-slate-700 dark:text-slate-200">{height.toFixed(2)} m</span>
                            </div>
                        </div>

                        <div className="space-y-5 px-2 mb-6">
                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-wider">Peso (Libras)</span>
                                    <span className="text-sm font-black text-black dark:text-white">{weight} lb</span>
                                </div>
                                <div className="relative h-2 bg-slate-200 dark:bg-slate-700 rounded-full">
                                    <div className="absolute top-0 left-0 bottom-0 bg-blue-600 rounded-full" style={{ width: `${Math.max(0, Math.min(100, weightPercentage))}%` }}></div>
                                    <input 
                                        type="range" 
                                        min={minWeight} 
                                        max="300" 
                                        value={weight} 
                                        onChange={(e) => setWeight(parseInt(e.target.value))}
                                        className="absolute inset-0 w-full h-full opacity-100 bg-transparent cursor-pointer z-10"
                                    />
                                </div>
                                <div className="flex justify-between text-[10px] font-bold text-slate-400 dark:text-slate-500 mt-2">
                                    <span>{minWeight} lb</span>
                                    <span>300 lb</span>
                                </div>
                            </div>

                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-wider">Estatura (Metros)</span>
                                    <span className="text-sm font-black text-black dark:text-white">{height.toFixed(2)} m</span>
                                </div>
                                <div className="relative h-2 bg-slate-200 dark:bg-slate-700 rounded-full">
                                    <div className="absolute top-0 left-0 bottom-0 bg-blue-600 rounded-full" style={{ width: `${Math.max(0, Math.min(100, heightPercentage))}%` }}></div>
                                    <input 
                                        type="range" 
                                        min="1.68" 
                                        max="1.90" 
                                        step="0.01"
                                        value={height} 
                                        onChange={handleHeightChange}
                                        className="absolute inset-0 w-full h-full opacity-100 bg-transparent cursor-pointer z-10"
                                    />
                                </div>
                                <div className="flex justify-between text-[10px] font-bold text-slate-400 dark:text-slate-500 mt-2">
                                    <span>1.68 m</span>
                                    <span>1.90 m</span>
                                </div>
                            </div>
                        </div>

                        <button onClick={onClose} className="w-full py-4 bg-slate-900 dark:bg-blue-600 hover:bg-black dark:hover:bg-blue-500 text-white font-black rounded-[1.5rem] text-sm transition-all active:scale-95 shadow-md">
                            Entendido
                        </button>
                    </div>
                </div>
            );
        };

        const ProfileModal = ({ isOpen, onClose, userProfile, setUserProfile, shipping, setShipping, promoApplied, setPromoApplied, totalItemsCount = 0 }) => {
            const [firstName, setFirstName] = useState(userProfile.firstName || '');
            const [lastName, setLastName] = useState(userProfile.lastName || '');
            const [selectedLocation, setSelectedLocation] = useState(shipping?.id || '');
            const [isLocPickerOpen, setIsLocPickerOpen] = useState(false);
            const [promoInput, setPromoInput] = useState(promoApplied ? 'DICED' : '');
            const [promoError, setPromoError] = useState(false);

            useEffect(() => {
                if (isOpen) {
                    setFirstName(userProfile.firstName || '');
                    setLastName(userProfile.lastName || '');
                    setSelectedLocation(shipping?.id || '');
                    setIsLocPickerOpen(false);
                    setPromoInput(promoApplied ? 'DICED' : '');
                    setPromoError(false);
                }
            }, [isOpen, userProfile, shipping, promoApplied]);

            const locations = [
                { id: 'boaco', name: 'Boaco', price: 150 },
                { id: 'bluefields', name: 'Bluefields', price: 280 },
                { id: 'camoapa', name: 'Camoapa', price: 150 },
                { id: 'chinandega', name: 'Chinandega', price: 130 },
                { id: 'ciudad_dario', name: 'Ciudad Darío', price: 150 },
                { id: 'ciudad_sandino', name: 'Ciudad Sandino', price: 150 },
                { id: 'el_sauce', name: 'El Sauce', price: 130 },
                { id: 'esteli', name: 'Estelí', price: 150 },
                { id: 'juigalpa', name: 'Juigalpa', price: 150 },
                { id: 'leon', name: 'León', price: 130 },
                { id: 'managua', name: 'Managua', price: 130 },
                { id: 'nagarote', name: 'Nagarote', price: 30 },
                { id: 'rivas', name: 'Rivas', price: 150 }
            ];

            const pickerOptions = ['Sin envío', ...locations.map(l => `${l.name} (C$${l.price})`)];
            const selectedLocData = locations.find(l => l.id === selectedLocation);
            const currentPickerValue = selectedLocData ? `${selectedLocData.name} (C$${selectedLocData.price})` : 'Sin envío';

            const handleLocationSelect = (val) => {
                if (val === 'Sin envío') {
                    setSelectedLocation('');
                } else {
                    const found = locations.find(l => `${l.name} (C$${l.price})` === val);
                    if (found) setSelectedLocation(found.id);
                }
            };

            const handleApplyPromo = () => {
                if (promoInput.trim().toUpperCase() === 'DICED') {
                    setPromoApplied(true);
                    setPromoError(false);
                } else {
                    setPromoError(true);
                    setPromoApplied(false);
                }
            };

            const removePromo = () => {
                setPromoApplied(false);
                setPromoInput('');
                setPromoError(false);
            };

            const handleSave = () => {
                setUserProfile({ firstName: firstName.trim(), lastName: lastName.trim() });
                const loc = locations.find(l => l.id === selectedLocation);
                setShipping(loc || null);
                if (promoInput.trim().toUpperCase() === 'DICED') {
                    setPromoApplied(true);
                } else if (promoInput.trim() === '') {
                    setPromoApplied(false);
                }
                onClose();
            };

            if (!isOpen) return null;

            const totalWeightKg = (totalItemsCount * 220) / 1000;
            const extraFiveKgBlocks = Math.floor(totalWeightKg / 5);
            const hasWeightSurcharge = extraFiveKgBlocks > 0;
            const weightSurcharge = selectedLocData ? (selectedLocData.price * (0.49 * extraFiveKgBlocks)) : 0;

            return (
                <div className="fixed inset-0 z-[130] flex items-end justify-center bg-black/50 backdrop-blur-sm transition-opacity p-0 sm:p-4">
                    <div className="absolute inset-0" onClick={onClose}></div>
                    
                    <div className="w-full sm:max-w-md bg-white dark:bg-slate-900 border-t dark:border border-transparent dark:border-slate-800 rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 relative flex flex-col shadow-2xl animate-in slide-in-from-bottom-full duration-300 z-10 max-h-[92vh] overflow-hidden">
                        <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-5 shrink-0"></div>
                        
                        <div className="flex items-center justify-center gap-2.5 mb-1 shrink-0">
                            <User size={24} className="text-blue-600 dark:text-blue-400" />
                            <h2 className="text-xl font-black text-black dark:text-white tracking-tight text-center">Mi Perfil</h2>
                        </div>
                        <p className="text-xs text-slate-500 dark:text-slate-400 text-center mb-5 font-medium shrink-0">Tus datos se guardan automáticamente para agilizar tus compras.</p>

                        <div className="space-y-5 overflow-y-auto hide-scrollbar flex-1 pb-4 px-0.5">
                            {/* Datos Personales */}
                            <div className="space-y-2.5">
                                <span className="text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest block px-1">Datos Personales</span>
                                <div className="grid grid-cols-2 gap-2.5">
                                    <input
                                        type="text"
                                        value={firstName}
                                        onChange={(e) => setFirstName(e.target.value)}
                                        placeholder="Nombre"
                                        className="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-2xl px-3.5 py-3 text-xs font-bold text-black dark:text-white focus:outline-none focus:border-blue-500 shadow-inner placeholder:text-slate-400"
                                    />
                                    <input
                                        type="text"
                                        value={lastName}
                                        onChange={(e) => setLastName(e.target.value)}
                                        placeholder="Apellido"
                                        className="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-2xl px-3.5 py-3 text-xs font-bold text-black dark:text-white focus:outline-none focus:border-blue-500 shadow-inner placeholder:text-slate-400"
                                    />
                                </div>
                            </div>

                            {/* Cupón de Descuento */}
                            <div className="space-y-2">
                                <span className="text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest block px-1">Cupón de Descuento Guardado</span>
                                {!promoApplied ? (
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={promoInput}
                                            onChange={(e) => setPromoInput(e.target.value.toUpperCase())}
                                            placeholder="Ingresa tu código"
                                            className="flex-1 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-2xl px-3.5 py-3 text-xs font-black text-black dark:text-white focus:outline-none focus:border-blue-500 uppercase shadow-inner placeholder:text-slate-400 placeholder:font-bold"
                                        />
                                        <button
                                            onClick={handleApplyPromo}
                                            className="bg-slate-900 dark:bg-blue-600 hover:bg-black dark:hover:bg-blue-500 text-white px-4 py-3 rounded-2xl text-xs font-black transition-all active:scale-95 shadow-md"
                                        >
                                            Validar
                                        </button>
                                    </div>
                                ) : (
                                    <div className="flex justify-between items-center bg-emerald-50/90 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 rounded-2xl px-3.5 py-3 shadow-sm">
                                        <div className="flex items-center gap-2">
                                            <Tag size={16} className="text-emerald-700 dark:text-emerald-400" />
